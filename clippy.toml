# `unwrap_used` and `expect_used` (Cargo.toml's [workspace.lints.clippy])
# guard library code. A `#[test]` function or `#[cfg(test)]` module may
# unwrap: a panic there is the failure report.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# The same exemption for `panic!` (clippy::panic, D-048). `unreachable!`,
# `todo!` and `unimplemented!` have no such setting: each crate's lib.rs
# allows them under `cfg(test)`, and each test crate root allows all four.
allow-panic-in-tests = true
