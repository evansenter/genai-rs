[workspace]
members = [
    "genai-rs-macros",
]
# The cargo-fuzz crate builds on nightly with its own lockfile.
exclude = ["fuzz"]

[workspace.lints.rust]
# A new `unsafe` is a reviewed decision: each existing site carries an
# explicit `#[allow(unsafe_code)]` and a SAFETY comment.
unsafe_code = "deny"
# No source currently branches on cfg(docsrs); this allowance keeps the
# docs.rs rustdoc-arg below lint-clean if a #[cfg(docsrs)] is ever added.
# `cargo fuzz` sets cfg(fuzzing), which compiles `__fuzz` (src/fuzzing.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(fuzzing)"] }

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# No default features either: reqwest's optional defaults (`http2`,
# `system-proxy`, `charset`) are genai-rs features a consumer can turn off,
# rather than forced on (#501). TLS stays rustls with the OS trust store.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
# No default features: each member names what it uses, so a consumer isn't
# handed tokio's full feature set (rt-multi-thread, signal, process, ...).
tokio = { version = "1.52", default-features = false }
async-stream = "0.3"
futures-util = "0.3"
thiserror = "2.0"
tracing = "0.1"
inventory = "0.3"
bytes = "1.11"
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[package]
name = "genai-rs"
version = "0.13.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A Rust client library for Google's Generative AI (Gemini) API with streaming, function calling, and multi-turn conversations"
repository = "https://github.com/evansenter/genai-rs"
documentation = "https://docs.rs/genai-rs"
readme = "README.md"
keywords = ["gemini", "google", "ai", "llm", "genai"]
categories = ["api-bindings", "asynchronous"]
# What `cargo package` ships: the library, its examples, and the Markdown
# that src/lib.rs's cfg(doctest) module includes, so a downloaded crate's
# doctests still build. Not the integration tests and their fixtures
# (tests/fixtures/api_surface/ alone is ~280 KB), CI, scripts, or the
# library's unit-test sources, which build only under cfg(test) (#501).
# The `check` job fails if a test-only path ships again.
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/DECISIONS.md",
    "/SECURITY.md",
    "/TROUBLESHOOTING.md",
    "/docs/*.md",
    # Maintainer notes the doctests do not include; README links to the gap
    # tracker resolve to the repository on crates.io.
    "!/docs/ANTIGRAVITY_BRIDGE_DESIGN.md",
    "!/docs/INTERACTIONS_API_GAP.md",
    "/examples/**",
    "!/examples/CLAUDE.md",
    "/src/**/*.rs",
    "!/src/**/*_tests.rs",
    "!/src/**/tests.rs",
    "!/src/proptest_*.rs",
    "!/src/test_subscriber.rs",
    "!/src/coverage_oracle/**",
]

# docs.rs builds with the antigravity feature (not all-features: that would
# pull in strict-unknown, compiling the docs build with the crate's documented
# Evergreen lenient behavior inverted). Per-item "Available on crate feature
# ... only" banners come from nightly rustdoc's crate-level doc(auto_cfg)
# default — no source attribute needed (feature(doc_auto_cfg) was removed in
# Rust 1.92; do not re-add it). The docsrs rustdoc-arg is the docs.rs
# convention, kept so local nightly repro matches production.
[package.metadata.docs.rs]
features = ["antigravity"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
genai-rs-macros = { version = "0.13.0", path = "./genai-rs-macros" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["fs", "time"] }
async-stream = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["io"] }
colored = { version = "3", optional = true }
colored_json = { version = "5", optional = true }
urlencoding = "2"
# Newline search in the SSE parser; already in the tree via serde_json.
memchr = "2.7"
# Antigravity harness client (feature = "antigravity"). The harness WebSocket
# is localhost-only (ws://), so no TLS features are needed.
tokio-tungstenite = { version = "0.29", optional = true }

[target.'cfg(unix)'.dependencies]
# SIGTERM escalation during harness shutdown (feature = "antigravity").
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
trybuild = "1.0.114"
tempfile = "3.15"
bytes = { workspace = true }
futures-util = { workspace = true }
proptest = "1.11"
chrono = { workspace = true }
doc-comment = "0.3"
regex = "1"
backon = "1.6"
# tests/credentials_tests.rs compares SHA-256 digests of credential values.
sha2 = "0.11"
# tests/non_exhaustive_responses.rs parses src/ to check struct attributes.
syn = { workspace = true, features = ["full", "visit"] }

[features]
default = ["wire-color", "http2", "system-proxy", "charset"]

## Colored output for the LoudWirePrinter wire inspector (LOUD_WIRE=1).
##
## Enabled by default. Disable (`default-features = false`) to drop the
## `colored` and `colored_json` dependencies; wire output falls back to
## plain pretty-printed text.
wire-color = ["dep:colored", "dep:colored_json"]

## HTTP/2 to the API, negotiated over TLS (reqwest's `http2`).
##
## Enabled by default. Without it every request uses HTTP/1.1, which the
## API also serves, and the `h2` crate is not built.
http2 = ["reqwest/http2"]

## Honor the system's proxy settings: the `HTTP_PROXY` / `HTTPS_PROXY` /
## `NO_PROXY` environment variables, and the OS configuration on macOS and
## Windows (reqwest's `system-proxy`).
##
## Enabled by default. Without it requests go direct unless a proxy is set
## on the client.
system-proxy = ["reqwest/system-proxy"]

## Decode a response body in the charset its `Content-Type` names
## (reqwest's `charset`, which builds `encoding_rs`).
##
## Enabled by default. Without it bodies are read as UTF-8, which is what
## the API sends.
charset = ["reqwest/charset"]

## Strict mode for unknown API values.
##
## When enabled, an unrecognized content type, step type, or string-enum value
## (statuses, modes, tiers, ...) in an API response is a deserialization error
## instead of an `Unknown` variant. Other tagged unions (`Tool`, `StepDelta`,
## `StreamChunk`, ...) still capture unknown values gracefully.
##
## Default: disabled (unknown types are captured gracefully)
strict-unknown = []

## Native client for Google's Antigravity `localharness` agent runtime.
##
## Adds the `genai_rs::antigravity` module: spawn the harness binary, drive
## agent conversations over its local WebSocket protocol, dispatch custom
## Rust tools, and enforce tool policies. See `docs/ANTIGRAVITY.md`.
##
## Default: disabled
antigravity = [
    "dep:tokio-tungstenite",
    "dep:libc",
    "tokio/io-util",
    "tokio/net",
    "tokio/process",
    "tokio/rt",
    "tokio/sync",
]

# Feature-gated integration tests
[[test]]
name = "antigravity_harness"
required-features = ["antigravity"]

[[test]]
name = "antigravity_scripted"
required-features = ["antigravity"]

# Antigravity harness examples (examples/antigravity/). Grouped in their own
# directory the way src/antigravity/ is: every one needs the feature and the
# localharness binary, which is a different setup story from the rest.
# Names are unchanged by that move, so `cargo run --example <name>` still works.
[[example]]
name = "antigravity_agent"
path = "examples/antigravity/agent.rs"
required-features = ["antigravity"]

[[example]]
name = "repo_auditor"
path = "examples/antigravity/repo_auditor/main.rs"
required-features = ["antigravity"]

