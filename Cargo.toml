required-features = ["antigravity"]

[[example]]
name = "mcp_toolbelt"
path = "examples/antigravity/mcp_toolbelt/main.rs"
required-features = ["antigravity"]

[[example]]
name = "proactive_agent"
path = "examples/antigravity/proactive_agent/main.rs"
required-features = ["antigravity"]

[[example]]
name = "cancellable_turn"
path = "examples/antigravity/cancellable_turn/main.rs"
required-features = ["antigravity"]

[[example]]
name = "lifecycle_hooks"
path = "examples/antigravity/lifecycle_hooks/main.rs"
