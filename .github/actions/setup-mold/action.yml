name: Set up mold
description: >-
  Installs the mold linker and enables the repo's opt-in cargo config that
  uses it. Linux/apt only; a no-op on every other runner, so it is safe to
  invoke unconditionally.

inputs:
  enable-config:
    description: >-
      Copy `.cargo/config.toml.example` into place. Leave true for a job whose
      checkout is at the workspace root. Set false from a job that checks the
      repo out to a subdirectory: there is no example file at the root to copy,
      and cargo would not discover the config from that build directory anyway.
    required: false
    default: "true"

outputs:
  have-mold:
    description: >-
      "1" when mold installed successfully, empty otherwise. Only meaningful to
      a caller that pairs this with `continue-on-error: true`; without that a
      failed install fails the job and nothing reads this. Gate the
      `-fuse-ld=mold` flag on it — naming a linker that is not installed is the
      #428 failure, which reports `cannot find 'ld'` against a binary that *is*
      present rather than the one that is not.
    value: ${{ steps.install.outputs.have-mold }}

runs:
  using: composite
  steps:
    - name: Install mold and enable the linker config
      id: install
      shell: bash
      env:
        # Read through `env:` rather than interpolating `${{ }}` into the
        # `run:` body. A `run:` block is a YAML block scalar that Actions
        # substitutes textually before bash parses it, so an expression there
        # is a substitution hazard rather than a shell variable.
        ENABLE_CONFIG: ${{ inputs.enable-config }}
      # Bounded with `timeout` rather than `timeout-minutes:`, which
      # composite-action steps do not support — setting it here fails the
      # whole workflow with "Failed to load action.yml" before anything runs.
      #
      # The bound matters: one PR run sat 98 minutes on an unresponsive apt
      # mirror and would have held the runner until GitHub's 6h default.
      # Normal is ~10-20s, so 300s only ever trips on a stall.
      #
      # 60 + 240 rather than one shared 300 or two independent 300s. Two
      # independent full budgets would double the worst case to ~10 minutes,
      # against the single `timeout-minutes: 5` this replaced. But one
      # shared budget collapses the `|| true` on `update`: an `update` that
      # ate the whole 300s would take `install` down with it and fail every
      # job using this composite, where today it is swallowed and `install`
      # proceeds from cached package lists. Splitting keeps the total under
      # the old ceiling *and* keeps that fallback meaningful.
      #
      # `sudo timeout`, not `timeout sudo`: the latter signals `sudo` and
      # depends on it forwarding SIGTERM down to the process that is
      # actually stalled. This puts the timer in the same process tree.
      #
      # The `cp` is the half that matters after #428: `.cargo/config.toml` is
      # no longer checked in, so without it CI silently loses mold. This
      # composite exists so that pairing lives in one place — it was copied
      # across 13 steps, and a copy is what goes stale if the example file is
      # ever renamed.
      run: |
        set -euo pipefail

        # Self-guarding rather than leaving `if: runner.os == 'Linux'` to
        # each caller: a per-call condition is the N-copies arrangement this
        # composite exists to remove. Without it the next job to add a bare
        # `uses:` line breaks the macOS and Windows legs, and nothing in the
        # action's name would have warned them.
        if [ "${RUNNER_OS:-}" != "Linux" ]; then
          echo "Not Linux (RUNNER_OS=${RUNNER_OS:-unset}) — skipping mold."
          echo "The cargo config this enables targets x86_64-unknown-linux-gnu"
          echo "only, so other runners use the default linker regardless."
          exit 0
        fi

        sudo timeout 60 apt-get update || true
        sudo timeout 240 apt-get install -y mold

        # Still strict when it runs. The `cp` is the half that matters after
        # #428, and a caller that asked for it and does not get it should fail
        # loudly — that is the rename protection this composite exists for.
        # Opting out is a caller assertion that there is nothing to enable, not
        # a tolerance for the file having gone missing.
        # Three arms, not an if/else. `[ "$x" = "true" ]` sends every value
        # that is not exactly `true` down the opt-out path — `"ture"`,
        # `"True"`, a future unquoted `1` — with no signal, and the symptom is
        # the #428 shape this composite exists to prevent: a green job quietly
        # building without the linker config, because the callers gate
        # RUSTFLAGS on `have-mold` rather than on the config having landed.
        # A caller that asked for something and did not get it should fail
        # loudly, which is the same argument the `cp` itself is strict on.
        case "$ENABLE_CONFIG" in
          true)
            cp .cargo/config.toml.example .cargo/config.toml
            ;;
          false)
            echo "enable-config=false — skipping the cargo config copy."
            ;;
          *)
            echo "::error::enable-config must be true or false, got '$ENABLE_CONFIG'"
            exit 1
            ;;
        esac

        # Last, so it is never written on a partial success: `set -e` aborts
        # above it if either the install or the `cp` fails, leaving the output
        # empty. The gate fails closed.
        echo "have-mold=1" >> "$GITHUB_OUTPUT"
