name: Fuzz

# A short, bounded run of every cargo-fuzz target in fuzz/ (see
# fuzz/README.md): the SSE parser, the stream pipeline over
# InteractionStreamEvent, Step, StepDelta and Content deserialization, the
# types read from the wire beside them (InteractionResponse, the resources
# and their list pages), and the Antigravity harness's OutputEvent. Each
# target checks for panics and a round trip where the input is valid.
# Weekly, on demand, and on pull requests that touch code the targets build.
# The Fuzz Gate job reports on every pull request, fuzzed or not, so it is
# the one check branch protection can require.
on:
  schedule:
    - cron: '41 3 * * 6' # Saturday 03:41 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "60"
  # Every pull request, with no `paths:` filter: a workflow a filter skips
  # reports no check at all, and a required one would then wait forever. The
  # `changes` job decides whether the targets run.
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the run fuzzes: always on schedule and on demand; on a pull
  # request, only when it touches what the targets compile. That is the
  # crate (of the antigravity feature, only the harness protocol the
  # harness_output_event target reads), its macros crate, and the fuzz crate
  # with its own lockfile (the root Cargo.lock is not used). Fuzz Gate reads
  # its verdict, so tests/ci_workflows/fuzz.rs pins this job whole: change
  # the pin with it.
  changes:
    name: Fuzzed Paths
    runs-on: ubuntu-latest
    outputs:
      fuzz: ${{ steps.paths.outputs.fuzz }}
    steps:
      # A pull request's checkout is its merge commit: its first parent is
      # the base, so the diff between them is what the merge would change.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Check whether a fuzzed path changed
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # In doubt (not a pull request, or not a merge commit), fuzz.
          if [ "$EVENT" != pull_request ] || ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only 'HEAD^1' HEAD)
          fuzz=false
          while IFS= read -r path; do
            case "$path" in
              src/antigravity/protocol/*)
                echo "Fuzzed path changed: $path"
                fuzz=true
                ;;
              src/antigravity/*) ;;
              src/*|genai-rs-macros/*|Cargo.toml|fuzz/*|.github/workflows/fuzz.yml)
                echo "Fuzzed path changed: $path"
                fuzz=true
                ;;
            esac
          done <<< "$changed"
          echo "fuzz=$fuzz" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every target runs, so one crash doesn't hide another.
      fail-fast: false
      matrix:
        target: [sse_parser, stream_event, step, step_delta, content, interaction_response, resource, harness_output_event]
        # A target whose [[bin]] has `required-features` builds with them.
        include:
          - target: harness_output_event
            features: antigravity
    steps:
      - uses: actions/checkout@v4
      # libFuzzer and the sanitizer flags cargo-fuzz passes need nightly.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # The corpus a run grows is kept, so each run starts from everything
      # earlier runs found rather than from the committed seeds alone. The
      # newest saved corpus for the target is restored (on a PR, main's).
      - name: Restore the corpus earlier runs grew
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # Fuzz Gate passes on this job's result, so nothing here may pass a
      # failing target: tests/ci_workflows/ holds every `run:` step of this
      # job to the escapes it knows (no `continue-on-error`, `|| true` or
      # other mask), and the run to the committed seeds.
      - name: Fuzz for a bounded time
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
          # Not a free-form expression in the script: the input is passed
          # through the environment and checked to be a number.
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '60' }}
        run: |
          set -euo pipefail
          case "$SECONDS_PER_TARGET" in
            ''|*[!0-9]*) echo "::error::seconds must be a whole number, got '$SECONDS_PER_TARGET'"; exit 1 ;;
          esac
          mkdir -p "corpus/$TARGET"
          # The committed seeds are read but never written; new finds go to
          # the scratch corpus. -timeout flags a hang on one input.
          cargo +nightly fuzz run ${FEATURES:+--features "$FEATURES"} \
            "$TARGET" "corpus/$TARGET" "seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10
      # Saved under a fresh key per run, from scheduled and manual runs only:
      # a PR's corpus grew on code that may not merge. Not after a crash, so
      # the next run does not start from the crashing input's neighbourhood
      # before it is fixed.
      - name: Save the grown corpus
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  # The check to require. The matrix's checks exist only on runs that fuzz,
  # so this one job passes when every target ran clean or none had to, and
  # fails otherwise. `always()`, so it reports when a target fails too.
  # tests/ci_workflows/fuzz.rs pins this job whole: change the pin with it.
  fuzz-gate:
    name: Fuzz Gate
    needs: [changes, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass when every target ran clean, or none had to run
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FUZZ_NEEDED: ${{ needs.changes.outputs.fuzz }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::The path check ended '$CHANGES_RESULT', so whether to fuzz is unknown."
            exit 1
          fi
          if [ "$FUZZ_NEEDED" != true ]; then
            echo "No fuzzed path changed; the targets did not run."
            exit 0
          fi
          if [ "$FUZZ_RESULT" != success ]; then
            echo "::error::The fuzz matrix ended '$FUZZ_RESULT'. A failed target uploads its input as the fuzz-<target>-crash artifact."
            exit 1
          fi
          echo "Every fuzz target ran clean."

  # Scheduled runs fail quietly (an email to whoever last committed this
  # file), so a red weekly run opens or updates a `ci-health-escalation` issue
  # and a green one closes it, as rust.yml does. It needs every job: a failed
  # path check skips the matrix, and a skip alone would not escalate.
  scheduled-run-status:
    name: Scheduled Run Status
    needs: [changes, fuzz, fuzz-gate]
    if: always() && github.event_name == 'schedule' && github.repository_owner == 'evansenter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Escalate a failing scheduled run
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # From context, not a literal: it is the join key between reporter and
          # resolver.
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          .github/scripts/report_scheduled_failure.sh "$SELF_WORKFLOW_NAME" "$RUN_URL" \
            "The weekly fuzz run found an input that panics a target or breaks
          its round trip, or the toolchain broke. Download the target's
          \`fuzz-<target>-crash\` artifact from the run, reproduce with
          \`cargo +nightly fuzz run <target> <file>\` in \`fuzz/\`, fix it, and
          keep the input as a regression test in \`src/fuzzing_tests.rs\`
          (see \`fuzz/README.md\`). A red build step with no artifact is
          nightly or cargo-fuzz drift."
      - name: Clear the failure issue once the run recovers
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: .github/scripts/resolve_scheduled_failure.sh "$SELF_WORKFLOW_NAME"
