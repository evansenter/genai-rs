name: Fresh Consumer Crate

# Compiles `#[tool]` from a throwaway crate outside this workspace, with
# exactly README.md's dependency set and no trait import. A missing
# *dependency* can only fail there: inside the workspace `async-trait` and
# `serde_json` always resolve. The trait-import half is also pinned on every
# PR by `tests/ui/pass_no_consumer_imports.rs`; trybuild gives a separate
# crate, but not a separate dependency resolve, so it cannot replace this.

on:
  schedule:
    - cron: '0 7 * * 1' # Weekly, Monday 07:00 UTC
  workflow_dispatch:
  # Also on PRs touching the two inputs this job verifies.
  pull_request:
    paths:
      - 'genai-rs-macros/src/**'
      - 'README.md'
      - '.github/workflows/consumer-crate.yml'
      # Only these jobs resolve the composite from a subdirectory checkout, so a
      # change that breaks that path is caught nowhere else.
      - '.github/actions/setup-mold/action.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  documented-requirements:
    name: README requirements compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: genai-rs
      - uses: dtolnay/rust-toolchain@stable
      # `continue-on-error`: mold only affects link speed, and this job's red
      # must mean one thing. The `./genai-rs/` prefix: a local `uses:` resolves
      # against $GITHUB_WORKSPACE, and a wrong path fails silently under
      # continue-on-error.
      - uses: ./genai-rs/.github/actions/setup-mold
        id: mold
        continue-on-error: true
        with:
          # Nothing to enable: the build runs in `consumer/`, outside the
          # checkout.
          enable-config: "false"

      # Split by `outcome`: under continue-on-error an empty `have-mold` looks
      # the same whether the install failed or was skipped off Linux.
      - name: Warn when the mold step failed
        if: ${{ !cancelled() && steps.mold.outcome == 'failure' }}
        run: |
          # One `echo`: the run summary truncates `::warning::` at the first
          # newline.
          echo "::warning::setup-mold failed, so this job built with the default linker (slower; nothing else changes). Three causes look identical from here: enable-config was neither true nor false, the action path did not resolve, or apt could not reach a mirror. See the log lines below."
          echo "Listed in order of how cheap they are to fix:"
          echo " 1. A bad 'enable-config' value — the composite logs an"
          echo "    ::error:: naming it. A typo in this file; fix and re-run."
          echo " 2. An unresolvable path — a local 'uses:' resolves against"
          echo "    \$GITHUB_WORKSPACE, and this job checks out to genai-rs/,"
          echo "    so the path needs that prefix."
          echo " 3. An apt mirror outage — transient, and the only one of the"
          echo "    three that is not a mistake in this repo."
      - name: Note when mold is deliberately skipped
        if: ${{ !cancelled() && steps.mold.outcome == 'success' && steps.mold.outputs.have-mold == '' }}
        run: |
          echo "::notice::mold is not applicable on this runner, so this job built with the default linker. Expected off Linux; nothing is wrong."

      - name: Scaffold a consumer crate outside the workspace
        run: |
          set -euo pipefail
          mkdir -p consumer/src

          # Extracted from README.md, not copied, so the documented dependency
          # set is what gets tested. Anchored on the Installation heading rather
          # than the first toml block. Only the `genai-rs*` lines become path
          # deps, so unreleased codegen is what compiles.
          awk '/^## Installation$/ { sect = 1 }
               sect && /^```toml$/ { grab = 1; next }
               grab && /^```$/ { exit }
               grab' genai-rs/README.md > readme-deps.toml
          if ! grep -q '^\[dependencies\]' readme-deps.toml; then
            echo "::error::Could not extract the Installation snippet from README.md."
            echo "This job would otherwise scaffold an empty dependency set and pass."
            exit 1
          fi
          sed -e 's|^genai-rs = .*|genai-rs = { path = "../genai-rs" }|' \
              -e 's|^genai-rs-macros = .*|genai-rs-macros = { path = "../genai-rs/genai-rs-macros" }|' \
              readme-deps.toml > deps.toml
          # The seds are silent no-ops on a non-match, which would build against
          # the published crate instead.
          for dep in '../genai-rs' '../genai-rs/genai-rs-macros'; do
            if ! grep -q "path = \"$dep\"" deps.toml; then
              echo "::error::Failed to rewrite a README dependency to path = \"$dep\"."
              echo "Without it this job would build against the published crate and"
              echo "could not see unreleased codegen changes — its entire purpose."
              cat deps.toml
              exit 1
            fi
          done

          echo "--- dependency set, as documented ---"
          cat deps.toml

          {
            echo '[package]'
            echo 'name = "consumer"'
            echo 'version = "0.1.0"'
            echo 'edition = "2024"'
            echo
            cat deps.toml
          } > consumer/Cargo.toml

          # No `use genai_rs::CallableFunction;`: the README promises `#[tool]`
          # needs none, so importing it here would let a regression through.
          cat > consumer/src/main.rs <<'RUST'
          use genai_rs_macros::tool;

          /// Gets the current weather for a city.
          #[tool]
          fn get_weather(city: String, units: Option<String>) -> String {
              format!("Sunny in {city} ({})", units.unwrap_or_else(|| "C".into()))
          }

          fn main() {
              // Both halves of what the macro emits, actually called. The
              // factory was previously compiled and never invoked, so a
              // codegen change that compiled but registered nothing would
              // still have passed.
              let declaration = get_weather_declaration();
              assert_eq!(declaration.name(), "get_weather");

              // Exercises the `Box<dyn CallableFunction>` construction and
              // the trait-object dispatch the registry itself uses.
              // `get_global_function_registry()` is `pub(crate)`, so this is
              // as close as a consumer can get to asserting registration.
              let factory = get_weather_callable_factory();
              assert_eq!(factory.declaration().name(), "get_weather");

              // The out-of-crate claims `#[non_exhaustive]` makes: the
              // documented migration, and the constructors that exist because
              // closing a type took literal syntax away. Pinned on every PR by
              // `tests/ui/pass_interaction_response_migration.rs` and
              // `pass_closed_type_constructors.rs`; repeated here because
              // only this job builds them from a fresh dependency resolve.
              let mut response = genai_rs::InteractionResponse::default();
              response.id = Some("x".into());
              assert_eq!(response.id.as_deref(), Some("x"));

              let modality = genai_rs::ModalityTokens::new("text", 1);
              assert_eq!(modality.tokens, 1);

              let agent = genai_rs::Agent::new("agents/x");
              assert_eq!(agent.id.as_deref(), Some("agents/x"));

              println!("ok: {}", declaration.name());
          }
          RUST

      # The default `. -> target` points at $GITHUB_WORKSPACE/target, which
      # never exists here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: consumer -> target
      - name: Build and run
        id: build
        working-directory: consumer
        env:
          # Cargo never discovers `genai-rs/.cargo/config.toml` from
          # `consumer/`. Gated on the install, or a missing mold becomes #428's
          # `cannot find 'ld'`.
          RUSTFLAGS: ${{ steps.mold.outputs.have-mold == '1' && '-C link-arg=-fuse-ld=mold' || '' }}
        run: |
          set -euo pipefail
          cargo run

      # Scoped to the build, so a checkout or apt flake doesn't get this
      # annotation.
      - name: Explain a failure
        if: failure() && steps.build.conclusion == 'failure'
        run: |
          echo "::error::A fresh consumer crate failed to compile a #[tool] function."
          echo "This is the failure class that cannot reproduce inside the workspace."
          echo "Check genai-rs-macros/src/codegen.rs emitted paths against README.md's"
          echo "promise: the Installation snippet's dependencies, and no trait import."
