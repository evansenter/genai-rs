name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features
      - name: Run unit tests
        run: cargo nextest run --workspace
      - name: Run doctests (default features)
        run: cargo test --workspace --doc
      - name: Run doctests (all features)
        run: cargo test --workspace --all-features --doc
      - name: Run integration tests
        run: |
          set -eo pipefail
          # Fail on an empty key: every integration test self-skips without one,
          # and this run gates a publish.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — every integration test would self-skip and this release would validate having verified nothing"
            exit 1
          fi
          rc=0
          cargo nextest run --workspace --run-ignored all --success-output=final 2>&1 | tee /tmp/integration.log || rc=$?
          # Both markers, as in rust.yml.
          skips=$(grep -cE 'SEMANTIC_VALIDATION_SKIPPED|LIVE_TOOL_EVIDENCE_SKIPPED' /tmp/integration.log || true)
          # 10, not rust.yml's 3 per binary: this is one whole-workspace run
          # (~50 markers), so both tolerate roughly 20%.
          if [ "${skips:-0}" -gt 10 ]; then
            echo "::error::$skips unverified assertion(s) or tolerated failure(s) — too many to trust this run (grep SEMANTIC_VALIDATION_SKIPPED or LIVE_TOOL_EVIDENCE_SKIPPED in the log for causes)"
            if [ "$rc" -eq 0 ]; then rc=1; fi
          elif [ "${skips:-0}" -gt 0 ]; then
            echo "::warning::$skips unverified assertion(s) or tolerated failure(s) (grep SEMANTIC_VALIDATION_SKIPPED or LIVE_TOOL_EVIDENCE_SKIPPED in the log for causes)"
          fi
          exit "$rc"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check documentation (all features)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation (docs.rs feature set)
        run: cargo doc --workspace --no-deps --features antigravity
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      # docs.rs builds on nightly rustdoc. Checked here, the last gate before
      # crates.io, so nightly churn can't redden PRs. No -D warnings: docs.rs
      # fails only on hard errors. Keep last: it changes the rustup default.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Check documentation (docs.rs feature set, nightly)
        run: cargo +nightly doc --workspace --no-deps --features antigravity --target-dir target/doc-docsrs-nightly
        env:
          RUSTDOCFLAGS: --cfg docsrs

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Publish genai-rs-macros
        run: cargo publish -p genai-rs-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: false

      - name: Wait for crates.io indexing
        run: |
          MACRO_VERSION=$(awk -F'"' '/^version = /{print $2; exit}' genai-rs-macros/Cargo.toml)
          # An empty version would make the grep below match anything and the
          # poll pass at once.
          if [ -z "$MACRO_VERSION" ]; then
            echo "::error::No anchored 'version = ' line in genai-rs-macros/Cargo.toml — cannot verify indexing."
            exit 1
          fi
          echo "Waiting for genai-rs-macros v${MACRO_VERSION} to be indexed..."
          for i in {1..30}; do
            # -F: the version is data, not a regex.
            if cargo search genai-rs-macros --limit 1 2>/dev/null | grep -qF -- "${MACRO_VERSION}"; then
              echo "Crate indexed successfully after $((i * 10)) seconds"
              exit 0
            fi
            echo "Attempt $i/30: Not yet indexed, waiting 10s..."
            sleep 10
          done
          echo "::error::Timed out waiting for crate indexing after 5 minutes"
          exit 1

      - name: Publish genai-rs
        run: cargo publish -p genai-rs --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}

          # Body from the curated CHANGELOG entry; generate_release_notes
          # appends the PR list and compare link. rc keeps exit 1 (no section)
          # apart from 2 (usage).
          rc=0
          .github/scripts/extract_changelog_section.sh \
              CHANGELOG.md "${TAG#v}" > /tmp/release-body.md || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Release body from the CHANGELOG.md [${TAG#v}] section"
          elif [ "$rc" -eq 1 ]; then
            # Fall back rather than fail: the crates are already published.
            echo "::warning::No [${TAG#v}] section in CHANGELOG.md — falling back to the commit list. Edit the release body by hand."
          else
            # Not fatal, unlike rust.yml: both crates are already published, and
            # a release with a bad body beats none.
            echo "::error::extract_changelog_section.sh exited $rc — a usage or environment error, not a missing section. Falling back to the commit list; the body needs replacing by hand."
          fi
          if [ "$rc" -ne 0 ]; then
            # `tformat`, not `format`: the body must end in a newline, as the
            # CHANGELOG branch's does.
            PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "Generating changelog from $PREV_TAG to $TAG"
              git log --pretty=tformat:"- %s" "$PREV_TAG..$TAG" > /tmp/release-body.md
            else
              echo "First release, generating full changelog"
              git log --pretty=tformat:"- %s" > /tmp/release-body.md
            fi
          fi

          echo "=== Release body ==="
          cat /tmp/release-body.md
          echo "===================="

      - name: Create release
        # v2: actionlint flags v1's runner as too old.
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
