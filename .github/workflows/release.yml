name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validate the release before publishing
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        # Same stall ceiling as rust.yml's mold installs, and it matters more
        # here: a stall holds publishing after the tag already exists. The
        # `|| true` also matches rust.yml — a transient mirror error on
        # `update` should not fail the release when the install can still
        # proceed from cached lists.
        timeout-minutes: 5
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features
      - name: Run unit tests
        run: cargo nextest run --workspace
      - name: Run doctests (default features)
        run: cargo test --workspace --doc
      - name: Run doctests (all features)
        run: cargo test --workspace --all-features --doc
      - name: Run integration tests
        run: |
          set -eo pipefail
          # Mirrors the rust.yml integration step: keep passing-test output so
          # vacuously-passed assertions surface as a warning even in release
          # validation — the run where a silent skip matters most.
          #
          # Which is why the total-skip case is guarded first. Every
          # integration test self-skips without a key, so a rotated or
          # cleared secret would validate a release by calling the API zero
          # times and still go green — gating a publish on nothing.
          # Trimmed, to match the `Ok(key) if !key.trim().is_empty()` the
          # tests and examples gate on: a secret of just whitespace would
          # pass a bare -z and then skip everything downstream anyway.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — every integration test would self-skip and this release would validate having verified nothing"
            exit 1
          fi
          rc=0
          cargo nextest run --workspace --run-ignored all --success-output=final 2>&1 | tee /tmp/integration.log || rc=$?
          # Both markers, matching rust.yml. This step runs the whole
          # workspace with --run-ignored all, so the live tool tests that
          # emit LIVE_TOOL_EVIDENCE_SKIPPED execute here too — counting only
          # the semantic marker would leave release validation, the run where
          # a silent skip matters most, as the one gate the newer marker does
          # not reach.
          skips=$(grep -cE 'SEMANTIC_VALIDATION_SKIPPED|LIVE_TOOL_EVIDENCE_SKIPPED' /tmp/integration.log || true)
          # Threshold scaled to this run's denominator: rust.yml applies 3
          # per test binary (largest group ~13 markers, ~23% tolerated); this
          # single workspace run has ~48 semantic validations plus at most one
          # tool-evidence skip — both of those sites are in
          # `test_mcp_server_tool_round_trip` and are mutually exclusive, so a
          # run can contribute only one — so 10 (~20%) keeps the two gates
          # equivalent in intent without moving.
          if [ "${skips:-0}" -gt 10 ]; then
            echo "::error::$skips assertion(s) passed vacuously — too many to trust this run (grep SEMANTIC_VALIDATION_SKIPPED or LIVE_TOOL_EVIDENCE_SKIPPED in the log for causes)"
            # Escalate only a passing run — a real nextest failure keeps
            # its own exit code and stays the headline cause.
            if [ "$rc" -eq 0 ]; then rc=1; fi
          elif [ "${skips:-0}" -gt 0 ]; then
            echo "::warning::$skips assertion(s) passed vacuously (grep SEMANTIC_VALIDATION_SKIPPED or LIVE_TOOL_EVIDENCE_SKIPPED in the log for causes)"
          fi
          exit "$rc"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check documentation (all features)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation (docs.rs feature set)
        run: cargo doc --workspace --no-deps --features antigravity
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      # docs.rs builds on nightly rustdoc, which no stable invocation can
      # mirror (e.g. the Rust 1.92 doc_auto_cfg removal was nightly-only
      # breakage). This is the last gate before the version becomes
      # immutable on crates.io, so the nightly check lives here rather
      # than in rust.yml, where nightly churn would redden unrelated PRs.
      # No -D warnings: docs.rs fails on hard errors only, and gating new
      # nightly lints here would block a release that would publish fine.
      # NOTE: installing the nightly toolchain changes the rustup default
      # for later steps — keep this the last step in the job.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Check documentation (docs.rs feature set, nightly)
        run: cargo +nightly doc --workspace --no-deps --features antigravity --target-dir target/doc-docsrs-nightly
        env:
          RUSTDOCFLAGS: --cfg docsrs

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        # Same stall ceiling as rust.yml's mold installs, and it matters more
        # here: a stall holds publishing after the tag already exists. The
        # `|| true` also matches rust.yml — a transient mirror error on
        # `update` should not fail the release when the install can still
        # proceed from cached lists.
        timeout-minutes: 5
        run: sudo apt-get update || true; sudo apt-get install -y mold

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Publish genai-rs-macros
        run: cargo publish -p genai-rs-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: false

      # Wait for crates.io to index the macros crate
      - name: Wait for crates.io indexing
        run: |
          MACRO_VERSION=$(grep '^version = ' genai-rs-macros/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Waiting for genai-rs-macros v${MACRO_VERSION} to be indexed..."
          for i in {1..30}; do
            if cargo search genai-rs-macros --limit 1 2>/dev/null | grep -q "${MACRO_VERSION}"; then
              echo "Crate indexed successfully after $((i * 10)) seconds"
              exit 0
            fi
            echo "Attempt $i/30: Not yet indexed, waiting 10s..."
            sleep 10
          done
          echo "::error::Timed out waiting for crate indexing after 5 minutes"
          exit 1

      - name: Publish genai-rs
        run: cargo publish -p genai-rs --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Create GitHub release
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 $TAG^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to $TAG"
            COMMITS=$(git log --pretty=format:"- %s" $PREV_TAG..$TAG)
          else
            echo "First release, generating full changelog"
            COMMITS=$(git log --pretty=format:"- %s")
          fi

          # Write to file to preserve newlines
          echo "$COMMITS" > /tmp/commits.txt

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body_path: /tmp/commits.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
