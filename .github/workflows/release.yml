name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validate the release before publishing
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features
      - name: Run unit tests
        run: cargo nextest run --workspace
      - name: Run doctests (default features)
        run: cargo test --workspace --doc
      - name: Run doctests (all features)
        run: cargo test --workspace --all-features --doc
      - name: Run integration tests
        run: |
          set -eo pipefail
          # Mirrors the rust.yml integration step: keep passing-test output so
          # vacuously-passed semantic validations surface as a warning even in
          # release validation — the run where a silent skip matters most.
          #
          # Which is why the total-skip case is guarded first. Every
          # integration test self-skips without a key, so a rotated or
          # cleared secret would validate a release by calling the API zero
          # times and still go green — gating a publish on nothing.
          # Trimmed, to match the `Ok(key) if !key.trim().is_empty()` the
          # tests and examples gate on: a secret of just whitespace would
          # pass a bare -z and then skip everything downstream anyway.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — every integration test would self-skip and this release would validate having verified nothing"
            exit 1
          fi
          rc=0
          cargo nextest run --workspace --run-ignored all --success-output=final 2>&1 | tee /tmp/integration.log || rc=$?
          skips=$(grep -c SEMANTIC_VALIDATION_SKIPPED /tmp/integration.log || true)
          # Threshold scaled to this run's denominator: rust.yml applies 3
          # per test binary (largest group ~13 semantic validations, ~23%
          # tolerated); this single workspace run has ~48, so 10 (~20%)
          # keeps the two gates equivalent in intent.
          if [ "${skips:-0}" -gt 10 ]; then
            echo "::error::$skips semantic validations passed vacuously — too many to trust this run (grep SEMANTIC_VALIDATION_SKIPPED in the log for causes)"
            # Escalate only a passing run — a real nextest failure keeps
            # its own exit code and stays the headline cause.
            if [ "$rc" -eq 0 ]; then rc=1; fi
          elif [ "${skips:-0}" -gt 0 ]; then
            echo "::warning::$skips semantic validation(s) passed vacuously (grep SEMANTIC_VALIDATION_SKIPPED in the log for causes)"
          fi
          exit "$rc"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check documentation (all features)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation (docs.rs feature set)
        run: cargo doc --workspace --no-deps --features antigravity
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      # docs.rs builds on nightly rustdoc, which no stable invocation can
      # mirror (e.g. the Rust 1.92 doc_auto_cfg removal was nightly-only
      # breakage). This is the last gate before the version becomes
      # immutable on crates.io, so the nightly check lives here rather
      # than in rust.yml, where nightly churn would redden unrelated PRs.
      # No -D warnings: docs.rs fails on hard errors only, and gating new
      # nightly lints here would block a release that would publish fine.
      # NOTE: installing the nightly toolchain changes the rustup default
      # for later steps — keep this the last step in the job.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Check documentation (docs.rs feature set, nightly)
        run: cargo +nightly doc --workspace --no-deps --features antigravity --target-dir target/doc-docsrs-nightly
        env:
          RUSTDOCFLAGS: --cfg docsrs

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Publish genai-rs-macros
        run: cargo publish -p genai-rs-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: false

      # Wait for crates.io to index the macros crate
      - name: Wait for crates.io indexing
        run: |
          MACRO_VERSION=$(awk -F'"' '/^version = /{print $2; exit}' genai-rs-macros/Cargo.toml)
          # Guarded because an empty read is worse here than anywhere else:
          # `grep -q ""` matches any output, so the poll below would report
          # "indexed successfully" on its first attempt without the crate
          # being indexed at all, and `genai-rs` would then publish against a
          # dependency crates.io cannot yet resolve. The tag check above
          # fails safe on an empty read (empty never equals the tag); this one
          # passes safe, which is the wrong direction.
          if [ -z "$MACRO_VERSION" ]; then
            echo "::error::No anchored 'version = ' line in genai-rs-macros/Cargo.toml — cannot verify indexing."
            exit 1
          fi
          echo "Waiting for genai-rs-macros v${MACRO_VERSION} to be indexed..."
          for i in {1..30}; do
            # `-F --`: the version is data, not a pattern. A literal match
            # also means a future pre-release suffix cannot be read as a regex.
            if cargo search genai-rs-macros --limit 1 2>/dev/null | grep -qF -- "${MACRO_VERSION}"; then
              echo "Crate indexed successfully after $((i * 10)) seconds"
              exit 0
            fi
            echo "Attempt $i/30: Not yet indexed, waiting 10s..."
            sleep 10
          done
          echo "::error::Timed out waiting for crate indexing after 5 minutes"
          exit 1

      - name: Publish genai-rs
        run: cargo publish -p genai-rs --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Create GitHub release
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}

          # The curated CHANGELOG entry, not a raw commit list. CLAUDE.md has
          # always told the releaser that release notes come from
          # CHANGELOG.md; the workflow never read it, so the published body
          # was two overlapping auto-generated commit lists (the `git log`
          # written here, plus `generate_release_notes`) and none of the prose
          # that was written for exactly this purpose. See #432.
          #
          # `generate_release_notes: true` stays: it appends the PR-linked
          # "What's Changed" list and the full-changelog compare link, which
          # the CHANGELOG does not carry. Only the hand-rolled duplicate of it
          # goes away.
          # `rc`, not a bare `if`: the script exits 2 for a usage error and 1
          # for a missing section, and collapsing those would annotate a
          # broken invocation as "no [X.Y.Z] section in CHANGELOG.md" — a
          # wrong diagnosis pointing at a file that may be perfectly fine.
          # This is the branch that ships a release body, so it is the one
          # worth distinguishing.
          rc=0
          .github/scripts/extract_changelog_section.sh \
              CHANGELOG.md "${TAG#v}" > /tmp/release-body.md || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Release body from the CHANGELOG.md [${TAG#v}] section"
          elif [ "$rc" -eq 1 ]; then
            # The recoverable case: the file is fine, the section is not
            # there. Falling back rather than failing, because the tag exists
            # and the crates are already published by this point — refusing to
            # cut the release over a formatting problem would leave it
            # half-done. Loud enough to be fixed by hand after.
            echo "::warning::No [${TAG#v}] section in CHANGELOG.md — falling back to the commit list. Edit the release body by hand."
          else
            # Annotated but NOT fatal, unlike the identical dispatch in
            # rust.yml. This job is `needs: publish`, so by the time it runs
            # both crates are immutable on crates.io — exiting here would
            # leave the release genuinely half-done (versions published, tag
            # pushed, no GitHub release), which is the outcome the fallback
            # below exists to avoid. A red annotation on a completed release
            # beats a completed publish with no release. The recovery table in
            # CLAUDE.md covers the residue either way.
            echo "::error::extract_changelog_section.sh exited $rc — a usage or environment error, not a missing section. Falling back to the commit list; the body needs replacing by hand."
          fi
          if [ "$rc" -ne 0 ]; then
            # Both non-zero paths land here — each has already annotated
            # itself at the right severity above, so this block is only the
            # body generation.
            #
            # `tformat`, not `format`: `format` omits the terminating
            # newline, so this branch would write a body that does not end in
            # one while the CHANGELOG branch above does. The file gets
            # concatenated with the auto-generated change list, and this is
            # the branch nobody exercises before a real tag.
            PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "Generating changelog from $PREV_TAG to $TAG"
              git log --pretty=tformat:"- %s" "$PREV_TAG..$TAG" > /tmp/release-body.md
            else
              echo "First release, generating full changelog"
              git log --pretty=tformat:"- %s" > /tmp/release-body.md
            fi
          fi

          echo "=== Release body ==="
          cat /tmp/release-body.md
          echo "===================="

      - name: Create release
        # v2, not v1: actionlint flags v1's runner as too old for GitHub
        # Actions — i.e. this step was heading for a hard failure on the one
        # workflow that only ever runs after a tag exists.
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
