name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Run unit tests
        run: cargo nextest run --workspace
      - name: Run doctests (default features)
        run: cargo test --workspace --doc
      - name: Run doctests (all features)
        run: cargo test --workspace --all-features --doc

  test-strict-unknown:
    name: Test Suite (strict-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Run unit tests with strict-unknown feature
        run: cargo nextest run --workspace --features strict-unknown
      - name: Run doctests with strict-unknown feature
        run: cargo test --workspace --features strict-unknown --doc

  test-antigravity:
    name: Test Suite (antigravity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Install pinned localharness wheel
        # Version must match SUPPORTED_HARNESS_VERSION in src/antigravity/.
        run: pip install google-antigravity==0.1.10
      - name: Run unit tests with antigravity feature
        run: cargo nextest run --workspace --features antigravity
      # The model-backed tests in this binary are the only ones that
      # drive a real turn end-to-end, which makes them the only guard
      # against a harness protocol change breaking turn completion. They
      # self-skip without a key — so omitting it here made them pass
      # vacuously, and the harness 0.1.5 -> 0.1.10 terminal-state rename
      # (every turn hanging to timeout) went unnoticed.
      # Same-repo guard on this step only, not the job: the unit-test step
      # above needs no key, and gating the whole job would stop forks from
      # running the antigravity-gated unit tests entirely.
      - name: Run harness integration tests
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        # --retries 2 for the same reason as the integration matrix: this
        # step now draws on the same shared key, so it sees the same
        # low-rate 429s. A retried test is reported FLAKY, not hidden.
        run: cargo nextest run --features antigravity --run-ignored all --retries 2 -E 'binary(antigravity_harness)'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Examples were compiled but never executed, so bugs that only show
      # up in a real run stayed invisible: `on_post_tool` reporting every
      # successful builtin as a failure was found by running one of these
      # by hand, not by any test. Both finish in seconds.
      - name: Smoke-run antigravity examples
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        # Belt and braces alongside the examples' own with_turn_timeout: a
        # harness that stops signalling turn completion hangs rather than
        # errors, and an unbounded step would burn the runner's full budget
        # instead of going red.
        timeout-minutes: 15
        run: |
          set -eo pipefail
          for ex in session_resume workspace_explorer mcp_toolbelt proactive_agent cancellable_turn; do
            echo "::group::cargo run --example $ex"
            cargo run --features antigravity --example "$ex"
            echo "::endgroup::"
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  test-integration:
    name: Integration Tests (${{ matrix.group }})
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            tests: "interactions_api_tests multiturn_tests streaming_multiturn_tests"
          - group: tools
            tests: "tools_and_config_tests agents_tests webhooks_and_agents_tests"
          - group: functions
            tests: "function_calling_tests"
          - group: multimodal
            tests: "multimodal_tests api_canary_tests temp_file_tests"
          - group: files-and-wire
            tests: "api_wire_format_live_tests files_api_tests"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-${{ matrix.group }}
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Run integration tests (${{ matrix.group }})
        run: |
          set -eo pipefail
          for test in ${{ matrix.tests }}; do
            echo "::group::Running $test"
            # --success-output=final keeps passing-test output (notably the
            # SEMANTIC_VALIDATION_SKIPPED marker) greppable in CI logs.
            # Capture the status instead of dying on it so the group is
            # closed and the skip warning still fires on a failing run —
            # the run where the skip count is most diagnostic.
            rc=0
            # --retries 2: the shared project key sees a low-rate 429 under
            # a five-way matrix, and nextest is fail-fast — so one transient
            # error discards the rest of the group (observed: 30 of 37 tests
            # skipped for a single 429). Retrying only the failed test costs
            # one call instead of re-running the matrix. Nothing is hidden:
            # a test that needed a retry is reported FLAKY, which is exactly
            # what the ci-flakiness-report job is for.
            cargo nextest run --test $test --run-ignored all --retries 2 --success-output=final 2>&1 | tee "/tmp/$test.log" || rc=$?
            echo "::endgroup::"
            skips=$(grep -c SEMANTIC_VALIDATION_SKIPPED "/tmp/$test.log" || true)
            if [ "${skips:-0}" -gt 3 ]; then
              # The tolerated-skip escape hatch is only meaningful while it
              # stays rare — past this threshold the run's green can't be
              # trusted, so fail instead of warn. Escalate only a passing
              # run: a real nextest failure keeps its own exit code.
              echo "::error::$test: $skips semantic validations passed vacuously — too many to trust this run (grep SEMANTIC_VALIDATION_SKIPPED in the log for causes)"
              if [ "$rc" -eq 0 ]; then rc=1; fi
            elif [ "${skips:-0}" -gt 0 ]; then
              echo "::warning::$test: $skips semantic validation(s) passed vacuously (grep SEMANTIC_VALIDATION_SKIPPED in the log for causes)"
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Check documentation (all features)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation (docs.rs feature set)
        # Mirrors [package.metadata.docs.rs] (features AND the docsrs
        # rustdoc-arg) on stable: gates warnings specific to the published
        # feature set. Nightly-only breakage (docs.rs builds on nightly) is
        # covered by the nightly step in release.yml's validate job (and by
        # release checklist step 0 in CLAUDE.md), not this job.
        run: cargo doc --workspace --no-deps --features antigravity
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Check workspace with MSRV
        run: cargo check --workspace

  cross-platform:
    name: Cross Platform (${{ matrix.os }}, ${{ matrix.rust }})
    # Only run on main branch pushes to speed up PR feedback loop.
    # Platform-specific issues are rare and will be caught immediately after merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Install mold linker (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Build
        run: cargo build --workspace --release
      - name: Run tests
        # Use release mode on Windows to avoid linker resource exhaustion (error 1318)
        run: cargo nextest run --workspace --cargo-profile release
      - name: Run doctests
        run: cargo test --workspace --release --doc

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-metrics:
    name: Build Metrics
    runs-on: ubuntu-latest
    # Only run on PRs that change code (not docs-only changes)
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install mold linker
        run: sudo apt-get update || true; sudo apt-get install -y mold
      - name: Clean build time
        run: |
          echo "## Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo clean
          start=$(date +%s)
          cargo build --release
          end=$(date +%s)
          duration=$((end - start))
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Clean release build | ${duration}s |" >> $GITHUB_STEP_SUMMARY
      - name: Build examples
        run: |
          start=$(date +%s)
          cargo build --release --examples
          end=$(date +%s)
          duration=$((end - start))
          echo "| Examples build | ${duration}s |" >> $GITHUB_STEP_SUMMARY
      - name: Binary sizes
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Example Binary Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Example | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          for f in target/release/examples/simple_interaction target/release/examples/auto_function_calling target/release/examples/streaming; do
            if [ -f "$f" ]; then
              size=$(ls -lh "$f" | awk '{print $5}')
              name=$(basename "$f")
              echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
      - name: Check size limits
        run: |
          # Fail if any example exceeds 16MB (raised from 10MB for the
          # 2026-05-20 revision surface + reqwest 0.13 at ~10.1MB, then past
          # 12MB when stable-toolchain drift pushed auto_function_calling to
          # ~13MB; 16MB keeps ~20% headroom over that so routine toolchain
          # drift doesn't re-trip it. Guards runaway growth, not absolute size)
          for f in target/release/examples/*; do
            if [ -f "$f" ] && [[ "$(basename "$f")" != *.d ]]; then
              size=$(stat -c%s "$f")
              if [ "$size" -gt 16777216 ]; then
                echo "::error::Binary $(basename $f) exceeds 16MB limit: $size bytes"
                exit 1
              fi
            fi
          done

