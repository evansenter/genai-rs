name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Run unit tests
        run: cargo nextest run --workspace
      - name: Run doctests (default features)
        run: cargo test --workspace --doc
      - name: Run doctests (all features)
        run: cargo test --workspace --all-features --doc

  test-strict-unknown:
    name: Test Suite (strict-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Run unit tests with strict-unknown feature
        run: cargo nextest run --workspace --features strict-unknown
      - name: Run doctests with strict-unknown feature
        run: cargo test --workspace --features strict-unknown --doc

  test-antigravity:
    name: Test Suite (antigravity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Install pinned localharness wheel
        # Version must match SUPPORTED_HARNESS_VERSION in src/antigravity/.
        run: pip install google-antigravity==0.1.10
      - name: Run unit tests with antigravity feature
        run: cargo nextest run --workspace --features antigravity
      # The model-backed tests in this binary are the only ones that
      # drive a real turn end-to-end, which makes them the only guard
      # against a harness protocol change breaking turn completion. They
      # self-skip without a key — so omitting it here made them pass
      # vacuously, and the harness 0.1.5 -> 0.1.10 terminal-state rename
      # (every turn hanging to timeout) went unnoticed.
      # Same-repo guard on this step only, not the job: the unit-test step
      # above needs no key, and gating the whole job would stop forks from
      # running the antigravity-gated unit tests entirely. The repository
      # check is part of that guard rather than redundant with it: `push`
      # fires on a fork's own main too (Sync fork), as does a fork-internal
      # PR where head and base are both the fork, and the hard failure
      # below would then fire in a repo that never had the secret.
      # Owner rather than the full slug: a rename would otherwise make both
      # key-gated steps skip everywhere including upstream, which is the
      # same vacuous pass the checks below exist to stop -- only moved to
      # the `if:`, where no ::error:: can fire.
      - name: Run harness integration tests
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository_owner == 'evansenter'
        # --retries 2 for the same reason as the integration matrix: this
        # step now draws on the same shared key, so it sees the same
        # low-rate 429s. A retried test is reported FLAKY, not hidden.
        run: |
          set -eo pipefail
          # These tests self-skip without a key, so a rotated or cleared
          # secret would turn this step green having run nothing — the exact
          # vacuous pass that let the 0.1.5 -> 0.1.10 break reach a release
          # (see the comment above). The `if:` above rules out forks --
          # including a fork's own push to main, which satisfies the
          # event_name arm -- but cannot see a rotated or cleared secret.
          # Trimmed, to match the `Ok(key) if !key.trim().is_empty()` the
          # tests and examples gate on: a secret of just whitespace would
          # pass a bare -z and then skip everything downstream anyway.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — the harness tests would self-skip and this step would pass having verified nothing"
            exit 1
          fi
          cargo nextest run --features antigravity --run-ignored all --retries 2 -E 'binary(antigravity_harness)'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Examples were compiled but never executed, so bugs that only show
      # up in a real run stayed invisible: `on_post_tool` reporting every
      # successful builtin as a failure was found by running one of these
      # by hand, not by any test. Most finish in seconds; repo_auditor
      # drives subagents and is the one whose cost is not yet measured.
      - name: Smoke-run antigravity examples
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository_owner == 'evansenter'
        # Belt and braces alongside the examples' own with_turn_timeout: a
        # harness that stops signalling turn completion hangs rather than
        # errors, and an unbounded step would burn the runner's full budget
        # instead of going red.
        #
        # A runner-budget cap, not a bound above the retry loop's worst
        # case. It was the latter when this was five examples at 120s/180s;
        # with seven examples and wrappers of 300s/360s/420s/660s, three
        # attempts apiece run well past this. That is deliberate: the
        # per-attempt `timeout` below is what attributes a hang to an example
        # by name, and it does that job whenever a small number of examples
        # hang, which is every case observed. Reaching this ceiling is a
        # different failure, and a step-level timeout is the accepted
        # reporting for it — raising the ceiling to cover the worst case
        # would mean a wedged run burning two hours of runner before saying
        # anything.
        #
        # repo_auditor can reach it unaccompanied (3 x 660s is 33min), so
        # this is not only a pileup case. Attribution survives even then:
        # its per-attempt `::warning::` timed-out lines print as they go,
        # and only the terminal failed-N-times line is lost to the step
        # timeout. It is ordered *last* in the loop below for that reason:
        # the six faster examples finish and report before the one that can
        # exhaust the ceiling starts, so a hang there costs its own coverage
        # rather than theirs. A step killed mid-list leaves no signal
        # separating "passed" from "never ran".
        timeout-minutes: 30
        run: |
          set -eo pipefail
          # Every example self-skips without a key, so a rotated or cleared
          # secret would run seven processes that each print one line and
          # exit 0 — green, having proven nothing.
          # Trimmed, to match the `Ok(key) if !key.trim().is_empty()` the
          # tests and examples gate on: a secret of just whitespace would
          # pass a bare -z and then skip everything downstream anyway.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — every example would self-skip and this step would pass having verified nothing"
            exit 1
          fi
          # Retry each example, for the same reason the nextest steps use
          # --retries: four of the five hard-fail on LLM-dependent outcomes
          # (no MCP call made, fewer than N chars streamed before the halt,
          # no trigger inside the window, empty restored history). Those
          # assertions are deliberate — a run that proves nothing must not
          # pass green — but a single unlucky turn should not redden an
          # unrelated PR. `cargo run` has no --retries, hence the loop.
          #
          # Each attempt gets its own `timeout`, rather than relying on the
          # step budget: an example that hangs is then attributed to that
          # example by name, instead of the whole step dying on the ceiling
          # and reporting nothing about which one stalled.
          #
          # The wrapper must sit above each example's worst *legal* runtime,
          # so a slow-but-legal run is ended by the example — which reports a
          # real error naming the turn — and the wrapper only ever catches a
          # process that stopped responding altogether. Below it, the wrapper
          # preempts the example's own ceiling and the loop reads a legal
          # slow run as a broken example: this mechanism's own misattribution
          # failure, running backwards.
          #
          # The examples are already compiled by the `cargo nextest run
          # --workspace --features antigravity` step above — nextest shells
          # out to `cargo test --no-run`, which builds `--example` targets
          # too (verified by breaking one: the build fails at that step, not
          # here). Same features, same dev profile, so `cargo run` below
          # re-execs an existing binary rather than compiling under the
          # wrapper. A broken example therefore fails once as a build error
          # up there, instead of being retried three times down here and
          # reported as a flaky run.
          #
          # Note the units. `with_turn_timeout` bounds one *turn*; this
          # wrapper bounds the whole *process*, so the bar is
          # turns x ceiling, not ceiling — plus compile, process start and
          # harness spawn, which the turn budget never sees. Worst legal
          # runtime per example, against its budget below. The third column
          # is wall clock spent *outside* any turn, which no turn budget
          # bounds:
          #
          #                      turns x ceiling   out-of-turn   budget
          #   antigravity_agent   3 x 120s = 360             —  <  420
          #   repo_auditor        1 x 600s = 600             —  <  660
          #   proactive_agent     2 x 120s = 240      30s poll  <  360
          #   session_resume      2 x 120s = 240     2nd spawn  <  360
          #   workspace_explorer  1 x 120s = 120             —  <  300
          #   mcp_toolbelt        1 x 120s = 120             —  <  300
          #   cancellable_turn    1 x 180s = 180             —  <  300
          #
          # proactive_agent polls up to 30s for a trigger delivery between
          # its two turns, so a 300s budget would have left only ~30s for
          # the link step and spawn — thin enough that a cold runner could
          # fire the wrapper on a run that stayed inside every budget the
          # example declares. session_resume spawns a second harness to
          # prove resume works, and at 300s its 60s of headroom would have
          # covered two spawns at that same ~30s apiece — so it gets the
          # same treatment, rather than a story about why a second spawn is
          # cheaper to absorb than the poll was.
          #
          # Re-check this table when an example gains a turn, changes its
          # budget, or waits on anything outside a turn; every one declares
          # its budget explicitly so the first column reads off the source.
          #
          # Not a replacement for the step budget: enough simultaneous
          # hangs run well over the 30min `timeout-minutes` above — three
          # attempts each, plus `--kill-after` grace and the backoff sleeps
          # — and that case reports as it always did. Deliberately not
          # spelled as a total: it would need recomputing on every budget
          # change, and the conclusion does not turn on the figure.
          #
          # All seven, not the five this started with: repo_auditor is the
          # example the README sends people to first and was the only one
          # never executed here, and antigravity_agent is the starter. Both
          # were compile-only, which is how `on_post_tool` reporting every
          # successful builtin as a failure survived — that was found by
          # running an example by hand. repo_auditor drives subagents over
          # a fixture repo, so it is the slowest of the seven; this run is
          # the first measurement of what a healthy one costs.
          for ex in antigravity_agent session_resume workspace_explorer mcp_toolbelt proactive_agent cancellable_turn repo_auditor; do
            # Above the example's own with_turn_timeout, never below.
            case "$ex" in
              # Declares 600s.
              repo_auditor) budget=660 ;;
              # Declares 120s, but takes three sequential turns.
              antigravity_agent) budget=420 ;;
              # Two turns at 120s, plus up to 30s polling out-of-turn for
              # the trigger delivery.
              proactive_agent) budget=360 ;;
              # Two turns at 120s, and it spawns a second harness to prove
              # resume works — two spawns to absorb, not one.
              session_resume) budget=360 ;;
              # The rest are single-turn at 120s, or 180s for cancellable_turn.
              *) budget=300 ;;
            esac
            echo "::group::cargo run --example $ex (budget ${budget}s)"
            attempt=1
            until timeout --signal=TERM --kill-after=30s "${budget}s" cargo run --features antigravity --example "$ex"; do
              rc=$?
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                echo "::warning::$ex timed out after ${budget}s (attempt $attempt)"
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "::error::$ex failed $attempt times (last exit $rc)"
                echo "::endgroup::"
                exit 1
              fi
              echo "::warning::$ex failed (attempt $attempt, exit $rc), retrying"
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "::endgroup::"
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  test-integration:
    name: Integration Tests (${{ matrix.group }})
    needs: check
    runs-on: ubuntu-latest
    # Owner check for the same reason as the antigravity steps: the vacuous-
    # pass guard below hard-fails on a missing key, and `push` fires on a
    # fork's own main too, so without it a fork would go red for a secret it
    # was never going to have.
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository_owner == 'evansenter'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            tests: "interactions_api_tests multiturn_tests streaming_multiturn_tests"
          - group: tools
            tests: "tools_and_config_tests agents_tests webhooks_and_agents_tests"
          - group: functions
            tests: "function_calling_tests"
          - group: multimodal
            tests: "multimodal_tests api_canary_tests temp_file_tests"
          - group: files-and-wire
            tests: "api_wire_format_live_tests files_api_tests"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-${{ matrix.group }}
      - uses: ./.github/actions/setup-mold
      - name: Run integration tests (${{ matrix.group }})
        run: |
          set -eo pipefail
          # Every test in these five groups is #[ignore = "Requires API key"]
          # and self-skips when get_client() finds no key, so a rotated or
          # cleared secret would print ~217 skip lines across the matrix and
          # report green having called the API zero times. That is the same
          # vacuous pass guarded on the antigravity steps above, on the suite
          # with the most coverage and the one release validation leans on.
          # The SEMANTIC_VALIDATION_SKIPPED escalation below is the same
          # argument applied to a partial skip; this is the total case.
          # Trimmed, to match the `Ok(key) if !key.trim().is_empty()` the
          # tests and examples gate on: a secret of just whitespace would
          # pass a bare -z and then skip everything downstream anyway.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — every integration test would self-skip and this job would pass having verified nothing"
            exit 1
          fi
          for test in ${{ matrix.tests }}; do
            echo "::group::Running $test"
            # --success-output=final keeps passing-test output (notably the
            # SEMANTIC_VALIDATION_SKIPPED marker) greppable in CI logs.
            # Capture the status instead of dying on it so the group is
            # closed and the skip warning still fires on a failing run —
            # the run where the skip count is most diagnostic.
            rc=0
            # --retries 2: the shared project key sees a low-rate 429 under
            # a five-way matrix, and nextest is fail-fast — so one transient
            # error discards the rest of the group (observed: 30 of 37 tests
            # skipped for a single 429). Retrying only the failed test costs
            # one call instead of re-running the matrix. Nothing is hidden:
            # a test that needed a retry is reported FLAKY, which is exactly
            # what the ci-flakiness-report job is for.
            cargo nextest run --test $test --run-ignored all --retries 2 --success-output=final 2>&1 | tee "/tmp/$test.log" || rc=$?
            echo "::endgroup::"
            skips=$(grep -c SEMANTIC_VALIDATION_SKIPPED "/tmp/$test.log" || true)
            if [ "${skips:-0}" -gt 3 ]; then
              # The tolerated-skip escape hatch is only meaningful while it
              # stays rare — past this threshold the run's green can't be
              # trusted, so fail instead of warn. Escalate only a passing
              # run: a real nextest failure keeps its own exit code.
              echo "::error::$test: $skips semantic validations passed vacuously — too many to trust this run (grep SEMANTIC_VALIDATION_SKIPPED in the log for causes)"
              if [ "$rc" -eq 0 ]; then rc=1; fi
            elif [ "${skips:-0}" -gt 0 ]; then
              echo "::warning::$test: $skips semantic validation(s) passed vacuously (grep SEMANTIC_VALIDATION_SKIPPED in the log for causes)"
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  shell-scripts:
    name: Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One entry point for every harness under `.github/scripts/tests/`,
      # via the same make target a contributor runs locally, so CI and
      # `make check` cannot disagree about what is covered.
      #
      # No toolchain needed, so this reports in seconds — which is why the
      # harnesses live here rather than in `build-metrics`, a job that opens
      # with `cargo clean` and a full release build. A shell lint failure
      # should not take ten minutes to surface.
      #
      # `bash -n` cannot catch what these scripts get wrong — the
      # `$ENV.TITLE` ordering bug was valid syntax meaning the wrong thing —
      # so the branches are exercised against a stubbed `gh`, and shellcheck
      # covers the quoting and `set -e` classes the fixtures structurally
      # cannot reach.
      - name: Run the shell harnesses and shellcheck
        run: make test-scripts

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Check documentation (all features)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation (docs.rs feature set)
        # Mirrors [package.metadata.docs.rs] (features AND the docsrs
        # rustdoc-arg) on stable: gates warnings specific to the published
        # feature set. Nightly-only breakage (docs.rs builds on nightly) is
        # covered by the nightly step in release.yml's validate job (and by
        # release checklist step 0 in CLAUDE.md), not this job.
        run: cargo doc --workspace --no-deps --features antigravity
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Check workspace with MSRV
        run: cargo check --workspace

  cross-platform:
    name: Cross Platform (${{ matrix.os }}, ${{ matrix.rust }})
    # Only run on main branch pushes to speed up PR feedback loop.
    # Platform-specific issues are rare and will be caught immediately after merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      # No `if: runner.os == 'Linux'` — the composite guards itself, and
      # says so on the other legs. Reintroducing the condition here would
      # restore the per-call-site knowledge the composite removed.
      - uses: ./.github/actions/setup-mold
      - name: Build
        run: cargo build --workspace --release
      - name: Run tests
        # Use release mode on Windows to avoid linker resource exhaustion (error 1318)
        run: cargo nextest run --workspace --cargo-profile release
      - name: Run doctests
        run: cargo test --workspace --release --doc

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: ./.github/actions/setup-mold
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-metrics:
    name: Build Metrics
    runs-on: ubuntu-latest
    # PRs consume the size baseline; main pushes publish it. Previously this
    # was PR-only, which is fine for an absolute ceiling but leaves a delta
    # check with nothing to compare against — so main is now included, at the
    # cost of running this job on merges as well. That is the price of
    # absorbing toolchain drift automatically instead of bumping a ceiling by
    # hand every few releases (#403).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: read # `gh run download` for the baseline artifact
    steps:
      - uses: actions/checkout@v4
      # First, before the clean release build: this depends only on bash and
      # jq, does not read `target/`, and fails in seconds. Late, a broken
      # assertion surfaced minutes in with the expensive work already sunk.
      #
      # The size check decides whether a PR goes red, and its interesting
      # behaviours are all comparisons it either makes or silently declines
      # to make — including the mode where it compares nothing and reports
      # "all examples within threshold". Fixtures, so that stays checked.
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-mold
      - name: Clean build time
        # Same feature set as `Build examples` below, for two reasons. The
        # reported number should describe the build everything downstream is
        # measured at — otherwise this row is a plain-default build while the
        # sizes come from an antigravity one. And a different feature set is a
        # different metadata hash, so without this the lib would be compiled
        # twice per run: once here, once again for the examples.
        run: |
          echo "## Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo clean
          start=$(date +%s)
          cargo build --release --features antigravity
          end=$(date +%s)
          duration=$((end - start))
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Clean release build | ${duration}s |" >> $GITHUB_STEP_SUMMARY
      - name: Build examples
        # `--features antigravity` because all seven `examples/antigravity/*`
        # targets carry `required-features = ["antigravity"]`, which is not in
        # `default`. A plain `cargo build --examples` silently skips a target
        # whose required features are off, so those seven never reached
        # `target/release/examples` — and so were absent from the summary
        # table, the delta check and the sanity ceiling alike. That is the
        # largest feature surface in the crate, which makes it the place a
        # size regression was most likely to go unnoticed. They compile in CI
        # already (`check` runs `--all-targets --all-features`), so this only
        # changes what gets linked and measured.
        #
        # This also shifts every other example's size, since they now link an
        # antigravity-enabled lib. Harmless in the steady state — baseline and
        # PR are measured by this same step, so both sides move together — but
        # not across the edit that changes this line. The baseline artifact
        # was measured at whatever feature set this step had on the last main
        # push, so the PR that adds or drops a feature here compares new-set
        # sizes against old-set ones, and a change of this size shifts every
        # example at once: expect the whole table to trip, not one target, and
        # nothing in it to hint that the feature flag is the cause. Waive that
        # one PR with `size-growth-ok` and push a commit; the next main push
        # republishes at the new feature set and it self-clears.
        run: |
          start=$(date +%s)
          cargo build --release --examples --features antigravity
          end=$(date +%s)
          duration=$((end - start))
          echo "| Examples build | ${duration}s |" >> $GITHUB_STEP_SUMMARY
      - name: Measure example sizes
        run: |
          .github/scripts/check_example_sizes.sh measure \
            target/release/examples current-sizes.json
          cat current-sizes.json

      # Rendered from current-sizes.json, not re-derived. This was the last
      # step in the job with its own size-measuring implementation (`ls -lh`
      # through `awk`), so the job carried two — and it sampled a hardcoded
      # three examples, silently omitting every other one, including the
      # antigravity targets and `multi_turn_agent_manual_stateless` that are
      # among the likeliest to move. One definition of "an example binary and
      # its size", now shared by the summary, the delta check and the
      # backstop.
      - name: Binary sizes
        run: |
          .github/scripts/check_example_sizes.sh render current-sizes.json \
            >> $GITHUB_STEP_SUMMARY
      # Per-example delta against the last main build, not an absolute
      # ceiling. The old 16MB ceiling had been raised three times (10 -> 12
      # -> 16), each time only after going red on an unrelated PR: an
      # absolute tripwire fires once drift accumulates past the margin, and
      # the only remedy is widening the margin — so it caught toolchain
      # drift loudly while a real per-PR regression under the ceiling passed
      # silently. See #403.
      #
      # The baseline is an artifact refreshed on every main push rather than
      # a committed file: sizes are toolchain- and linker-dependent, so a
      # committed number would encode one machine's toolchain and drift
      # against every other.
      - name: Fetch the size baseline from main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Best-effort: a missing baseline (first run after this lands, or
          # an expired artifact) must not fail the job — the compare step
          # skips and warns.
          #
          # `// empty`, not a bare `.[0].databaseId`: on an empty result set
          # jq prints the literal string "null", which passes `[ -n ]` and
          # sends the download after run "null".
          #
          # Several runs, not just the newest: a run whose artifact expired
          # or whose upload did not happen would otherwise mean no baseline
          # at all, even with an older successful run still carrying one.
          # `completed`, not `success`: the status is the whole `Rust` run's,
          # not this job's. `test-integration` runs five live-API matrix
          # groups on main pushes and CLAUDE.md says they may flake, so one
          # flake marks the run failed and skips a `size-baseline` artifact
          # that `build-metrics` published perfectly well. The loop below
          # already tolerates a run with no artifact — that is what the
          # `2>/dev/null` is for — so the stricter filter bought nothing the
          # loop did not already handle, and cost baselines.
          # "The lookup broke" and "there is nothing to look up" must not
          # read identically. Both end in the same `::warning::No usable
          # baseline` branch — honest, since the check genuinely did not run —
          # but the effective gate for that PR is then only the 64MB backstop,
          # four times looser than the ceiling this replaces. An expired
          # artifact self-clears on the next main push; a dropped
          # `actions: read` or a rate-limited token does not, and would look
          # like the benign first-PR case every time.
          #
          # stderr is deliberately not suppressed here (it still is on the
          # download below, where a missing artifact is the expected case).
          # The warning tells the reader to check permissions and rate limits;
          # gh's own message is what actually distinguishes those, so
          # discarding it would send them looking for something the log had
          # already thrown away. `RUN_IDS` captures stdout only, so letting
          # stderr through cannot contaminate the id list.
          # `rust.yml`, not `Rust`: `--workflow` accepts either the display
          # `name:` or the filename, and the display name is the cosmetic one
          # — the identifier most likely to be edited by someone with no
          # reason to look at this job. The failure branch below keeps a
          # rename from being silent (gh errors on an unknown workflow rather
          # than returning empty), but until someone reads that annotation
          # every PR sits on the weakest path, gated only by the 64MB
          # backstop. Cheaper to name the stable identifier.
          if ! RUN_IDS=$(gh run list --workflow rust.yml --branch main --status completed \
              --limit 10 --json databaseId --jq '.[].databaseId // empty'); then
            echo "::warning::Could not list main runs — the baseline lookup failed rather than finding nothing. See the gh error above; check the actions:read permission and rate limits."
            RUN_IDS=""
          fi
          for run_id in $RUN_IDS; do
            if gh run download "$run_id" --name size-baseline --dir baseline 2>/dev/null; then
              echo "Baseline from run $run_id"
              break
            fi
          done
          if [ -f baseline/current-sizes.json ]; then
            cp baseline/current-sizes.json baseline-sizes.json
          else
            echo "No size-baseline artifact on any of the last 10 completed main runs"
            : > baseline-sizes.json
          fi

      # PR-only, both here and on the fetch above, and that is a deliberate
      # trust boundary rather than leftover scoping: a direct push to main has
      # no PR to fail and no label to waive with, and the same run then
      # publishes its sizes as the new baseline — so growth arriving that way
      # is absorbed rather than flagged. Safe while branch protection requires
      # PRs into main; if that ever changes, the fix is to run `compare`
      # advisory-only on main pushes (fetch, compare, swallow the status) so
      # drift lands in the step summary before the baseline is overwritten.
      - name: Check size deltas
        if: github.event_name == 'pull_request'
        env:
          # The escape hatch the failure message promises. Kept in the
          # workflow rather than the script so the script needs no `gh` and
          # stays runnable — and testable — outside Actions.
          SIZE_GROWTH_OK: ${{ contains(github.event.pull_request.labels.*.name, 'size-growth-ok') }}
        # The delta table goes to the step summary as well as the log. The
        # absolute-size table already surfaced there, which had the value
        # ordering backwards — the deltas are the signal this job exists for,
        # and on a green run nobody opens the raw log, so routine drift stayed
        # invisible until it tripped the threshold.
        run: |
          # `pipefail` because the pipeline's status would otherwise be tee's,
          # and a failing compare would stop failing the step. The default
          # shell is `bash -e` with no pipefail.
          set -o pipefail
          {
            echo '### Example size deltas vs main'
            echo ''
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          rc=0
          .github/scripts/check_example_sizes.sh compare \
            baseline-sizes.json current-sizes.json 15 \
            | tee -a $GITHUB_STEP_SUMMARY || rc=$?
          # Fenced, so Markdown keeps the column alignment instead of
          # collapsing the runs of spaces. Closed unconditionally — an
          # unterminated fence would swallow whatever a later step appends.
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit "$rc"

      # Backstop only, deliberately far above any plausible size. The delta
      # check above is the real gate; this exists for the no-baseline case,
      # where a pathological binary would otherwise go unremarked.
      - name: Sanity ceiling
        run: |
          # Reads current-sizes.json rather than re-deriving with GNU-only
          # `stat -c%s`. `measure` already wrote every size portably — round 2
          # swapped it off `stat` precisely so the script runs on a macOS
          # checkout — and this loop re-implemented the `.d` filter while
          # still walking the hash-suffixed duplicates. One definition of "an
          # example binary and its size", shared by the backstop and the
          # delta check.
          over=$(jq -r 'to_entries[] | select(.value > 67108864)
            | "::error::Binary \(.key) exceeds the 64MB sanity ceiling: \(.value) bytes"' \
            current-sizes.json)
          if [ -n "$over" ]; then
            echo "$over"
            exit 1
          fi

      # After the sanity ceiling, deliberately. Published first, a build
      # carrying a pathological binary uploaded its sizes and *then* failed
      # the job — the red run is visible, but the artifact is already the
      # newest one the fetch loop finds, so every later PR measures against
      # the inflated number: the PR restoring normal sizes reads as a large
      # shrink and passes, and a re-regression back up to the bloated size
      # also passes at 0% growth. The delta gate would end up calibrated to
      # the build the backstop rejected. The ceiling reads only
      # current-sizes.json, so it has no ordering dependency on the upload.
      # Refreshes the baseline for subsequent PRs. Routine toolchain drift is
      # absorbed here instead of requiring a manual ceiling bump.
      - name: Publish the size baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: size-baseline
          path: current-sizes.json
          retention-days: 90
