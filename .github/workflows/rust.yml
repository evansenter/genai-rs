name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Weekly, so live-API drift surfaces before release day. The v0.12.0 release
  # found three server-side changes that had gone unnoticed for three weeks,
  # because the live suite ran only when someone pushed.
  schedule:
    - cron: '23 5 * * 3' # Wednesday 05:23 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features
      # Nothing else builds without the default features, and the library's
      # tokio features are now named per use, so a missing one only shows here.
      - name: Check library without default features
        run: cargo check --lib --no-default-features
      # What a release would ship (#501). Cargo.toml's `include` keeps the
      # tests and their fixtures, CI, scripts and the library's unit-test
      # sources out of the crate; this fails if one ships again, then builds
      # the packaged crates the way crates.io would, so an include list that
      # leaves out a file the library needs fails here, not at publish time.
      - name: Package contents
        run: |
          set -euo pipefail
          cargo package --list -p genai-rs > package-files.txt
          if grep -nE '^(\.github|tests|scripts|fuzz|\.config|\.cargo|proptest-regressions)/|^(Makefile|CLAUDE\.md|examples/CLAUDE\.md)$|_tests\.rs$|(^|/)tests\.rs$|^src/(proptest_|test_subscriber\.rs|coverage_oracle/)' package-files.txt; then
            echo "::error::cargo package would ship the test-only files above; exclude them in Cargo.toml's include list"
            exit 1
          fi
          echo "$(wc -l < package-files.txt) files would ship"
          cargo package --workspace

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Run unit tests
        run: cargo nextest run --workspace
      - name: Run doctests (default features)
        run: cargo test --workspace --doc
      - name: Run doctests (all features)
        run: cargo test --workspace --all-features --doc

  test-strict-unknown:
    name: Test Suite (strict-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      # Strict mode is a cfg, not a Cargo feature (D-030). RUSTFLAGS replaces
      # the mold linker flag from setup-mold's cargo config, so this job
      # links with the default linker.
      - name: Run unit tests in strict mode
        env:
          RUSTFLAGS: --cfg genai_strict_unknown
        run: cargo nextest run --workspace
      - name: Run doctests in strict mode
        env:
          RUSTFLAGS: --cfg genai_strict_unknown
          RUSTDOCFLAGS: --cfg genai_strict_unknown
        run: cargo test --workspace --doc

  test-antigravity:
    name: Test Suite (antigravity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Install pinned localharness wheel
        # Version must match SUPPORTED_HARNESS_VERSION in src/antigravity/.
        run: pip install google-antigravity==0.1.23
      - name: Run unit tests with antigravity feature
        run: cargo nextest run --workspace --features antigravity
      # The real harness against a scripted local model
      # (tests/common/fake_gemini.rs): builtins, hooks, containment,
      # cancellation, triggers. Deterministic and key-free, so it runs on
      # every PR, forks included, as part of this required check. The key is
      # blanked on purpose: nothing here may reach the real API.
      - name: Run scripted harness tests (no API key)
        run: cargo nextest run --features antigravity --run-ignored all -E 'binary(antigravity_scripted)'
        env:
          GEMINI_API_KEY: ""
      # The only live end-to-end guard against a harness protocol change. Key-gated
      # per step, not per job, so forks still run the unit tests. Only a fork's
      # pull_request lacks the secret; owner check: push, schedule and
      # workflow_dispatch also fire on a fork's own main, where it is absent.
      - name: Run harness integration tests
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository_owner == 'evansenter'
        run: |
          set -eo pipefail
          # Fail on an empty key: these tests self-skip without one. Whitespace
          # is stripped to match the tests' `!key.trim().is_empty()` gate.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — the harness tests would self-skip and this step would pass having verified nothing"
            exit 1
          fi
          cargo nextest run --features antigravity --run-ignored all -E 'binary(antigravity_harness)'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Retries for the shared key's occasional 429s; retried tests show
          # as FLAKY. Set here, not as --retries: the log echoes a step's env,
          # which is how count_retried_flakes.sh tells this step's tests from
          # the offline suite's in the same log.
          NEXTEST_RETRIES: 2
      # Run, not just compiled: some bugs only show up in a real run.
      - name: Smoke-run antigravity examples
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository_owner == 'evansenter'
        # A runner-budget cap, not a bound on the retry loop's worst case: the
        # per-attempt `timeout` below is what names a hung example. repo_auditor
        # runs last so a hang there cannot cost the others their coverage.
        timeout-minutes: 30
        run: |
          set -eo pipefail
          # Fail on an empty key: every example self-skips without one.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — every example would self-skip and this step would pass having verified nothing"
            exit 1
          fi
          # Retried: several examples hard-fail on LLM-dependent outcomes, and
          # `cargo run` has no --retries. Budgets sit above each example's
          # declared turn timeouts (turns x ceiling, plus out-of-turn waits), so
          # a hang is attributed by name and a slow-but-legal run is still ended
          # by the example itself. Already compiled by the nextest step above,
          # so no build runs under the timeout. An example that passed only on
          # a retry prints `EXAMPLE_RETRIED <name> <failed tries>`, which the
          # flakiness report counts (count_retried_flakes.sh).
          for ex in antigravity_agent session_resume workspace_explorer mcp_toolbelt proactive_agent cancellable_turn lifecycle_hooks file_watcher command_guard repo_auditor; do
            case "$ex" in
              # 1 turn x 600s.
              repo_auditor) budget=660 ;;
              # 3 turns x 120s.
              antigravity_agent) budget=420 ;;
              # 2 turns x 120s, plus up to 30s polling for the trigger delivery.
              proactive_agent) budget=360 ;;
              # 2 turns x 120s, plus a second harness spawn.
              session_resume) budget=360 ;;
              # 1 turn x 180s (the stop hook keeps it going), plus shutdown's
              # session-end hook.
              lifecycle_hooks) budget=300 ;;
              # Single turn at 120s (cancellable_turn: 180s).
              *) budget=300 ;;
            esac
            echo "::group::cargo run --example $ex (budget ${budget}s)"
            attempt=1
            until timeout --signal=TERM --kill-after=30s "${budget}s" cargo run --features antigravity --example "$ex"; do
              rc=$?
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                echo "::warning::$ex timed out after ${budget}s (attempt $attempt)"
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "::error::$ex failed $attempt times (last exit $rc)"
                echo "::endgroup::"
                exit 1
              fi
              echo "::warning::$ex failed (attempt $attempt, exit $rc), retrying"
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "::endgroup::"
            if [ "$attempt" -gt 1 ]; then
              echo "EXAMPLE_RETRIED $ex $((attempt - 1))"
            fi
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  test-integration:
    name: Integration Tests (${{ matrix.group }})
    needs: check
    runs-on: ubuntu-latest
    # Owner check: push, schedule and workflow_dispatch also fire on a fork's
    # own main, where the secret is absent.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository_owner == 'evansenter'
    # A hung test is killed by .config/nextest.toml after 10 minutes; this
    # caps the whole group, retries included.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every binary with `#[ignore = "Requires API key"]` tests goes in
          # exactly one group; tests/ci_coverage.rs enforces it.
          - group: core
            tests: "interactions_api_tests multiturn_tests streaming_multiturn_tests streaming_resume_tests error_handling_tests"
          - group: tools
            tests: "tools_and_config_tests webhooks_and_agents_tests credentials_tests environment_files_tests"
          - group: functions
            tests: "function_calling_tests tool_service_tests"
          - group: multimodal
            tests: "multimodal_tests api_canary_tests temp_file_tests processing_steps_tests voices_tests binding_parity_tests"
          - group: files-and-wire
            tests: "files_api_tests file_search_stores_tests"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-${{ matrix.group }}
      - uses: ./.github/actions/setup-mold
      - name: Run integration tests (${{ matrix.group }})
        run: |
          set -eo pipefail
          # Fail on an empty key: every test here self-skips without one.
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — every integration test would self-skip and this job would pass having verified nothing"
            exit 1
          fi
          # Every binary runs even after one fails: stopping at the first
          # failure once hid three binaries' results on a main push (the
          # three #476 had changed). The failures are listed at the end.
          failed=()
          for test in ${{ matrix.tests }}; do
            echo "::group::Running $test"
            # --success-output=final keeps passing tests' *_SKIPPED markers in
            # the log. rc is captured so the group closes and the skip check
            # still runs on a failure.
            rc=0
            # Retried by NEXTEST_RETRIES (env, below). --no-fail-fast: one
            # failure must not drop the binary's remaining tests.
            cargo nextest run --test $test --run-ignored all --no-fail-fast --success-output=final 2>&1 | tee "/tmp/$test.log" || rc=$?
            echo "::endgroup::"
            # LIVE_TOOL_EVIDENCE_SKIPPED: a live tool test that could not show
            # the server was reached. Occasional is noise; persistent is a
            # silently broken tool.
            skips=$(grep -cE 'SEMANTIC_VALIDATION_SKIPPED|LIVE_TOOL_EVIDENCE_SKIPPED' "/tmp/$test.log" || true)
            if [ "${skips:-0}" -gt 3 ]; then
              # Past 3, a green run can't be trusted. Both marker classes share
              # the budget; a real nextest failure keeps its own exit code.
              echo "::error::$test: $skips unverified assertion(s) or tolerated failure(s) — too many to trust this run (grep SEMANTIC_VALIDATION_SKIPPED or LIVE_TOOL_EVIDENCE_SKIPPED in the log for causes)"
              if [ "$rc" -eq 0 ]; then rc=1; fi
            elif [ "${skips:-0}" -gt 0 ]; then
              echo "::warning::$test: $skips unverified assertion(s) or tolerated failure(s) (grep SEMANTIC_VALIDATION_SKIPPED or LIVE_TOOL_EVIDENCE_SKIPPED in the log for causes)"
            fi
            [ "$rc" -eq 0 ] || failed+=("$test")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Retries for the shared key's occasional 429s; retried tests show
          # as FLAKY, and the flakiness report counts them
          # (count_retried_flakes.sh reads this from the step's echoed env).
          NEXTEST_RETRIES: 2

  example-smoke:
    name: Example Smoke Run
    needs: check
    runs-on: ubuntu-latest
    # Same owner gating as test-integration.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository_owner == 'evansenter'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: example-smoke
      - uses: ./.github/actions/setup-mold
      # Compile outside the per-example timeout, so a slow build is never
      # reported as a hung example.
      - name: Build examples
        run: cargo build --examples
      - name: Run examples
        run: |
          set -eo pipefail
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset — the examples cannot run"
            exit 1
          fi
          # A cheap subset, each exiting non-zero when its demo didn't happen.
          # One retry absorbs a transient 429 or an unlucky model turn; an
          # example that passed only on it prints `EXAMPLE_RETRIED <name> 1`,
          # which the flakiness report counts (count_retried_flakes.sh).
          for ex in simple_interaction streaming stateful_interaction explicit_turns \
                    auto_function_calling manual_function_calling structured_output \
                    pdf_input files_api multi_turn_agent_manual_stateless; do
            echo "::group::cargo run --example $ex"
            retried=0
            if ! timeout --kill-after=30s 300s cargo run --example "$ex"; then
              echo "::warning::$ex failed, retrying once"
              sleep 5
              if ! timeout --kill-after=30s 300s cargo run --example "$ex"; then
                echo "::error::$ex failed twice"
                echo "::endgroup::"
                exit 1
              fi
              retried=1
            fi
            echo "::endgroup::"
            if [ "$retried" -gt 0 ]; then
              echo "EXAMPLE_RETRIED $ex $retried"
            fi
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # tests/captured_fixtures.rs replays real API responses captured into
  # tests/fixtures/captured/. Weekly (and on demand) this re-captures them
  # from the live API and replays the fresh copies, so a change in what the
  # API sends goes red here instead of drifting past the offline suite. The
  # fresh captures are uploaded either way; commit them to refresh the
  # fixtures (#492). Committed captures over 90 days old fail the run.
  captured-fixtures:
    name: Captured Fixtures Refresh
    needs: check
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository_owner == 'evansenter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Re-capture the fixtures from the live API
        id: capture
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GEMINI_API_KEY is empty or unset, so nothing can be captured"
            exit 1
          fi
          python3 .github/scripts/capture_fixtures.py
          git diff --stat -- tests/fixtures/captured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Replay the fresh captures
        run: cargo nextest run --test captured_fixtures
      - name: Keep the fresh captures
        if: ${{ !cancelled() && steps.capture.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: captured-fixtures-${{ github.run_id }}
          path: tests/fixtures/captured
          retention-days: 30
      # This job cannot commit, so the committed copies (the ones the offline
      # suite replays) are checked instead: past 90 days unrefreshed, the
      # weekly run goes red and escalates, and the fix is to commit the
      # artifact above.
      - name: Committed captures are under 90 days old
        if: ${{ !cancelled() && steps.capture.conclusion == 'success' }}
        run: |
          git checkout -- tests/fixtures/captured
          python3 .github/scripts/capture_fixtures.py --check-age 90

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  shell-scripts:
    name: Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
      # Before the harnesses: test_check_workflow_shell.sh runs the parse
      # check, which imports `yaml`, and under CI a missing PyYAML fails it
      # rather than skipping.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      # Same make target as `make check`, so CI and local runs cover the same
      # things. No toolchain needed, so shell failures report in seconds.
      - name: Run the shell harnesses and shellcheck
        run: make test-scripts

      # The real CHANGELOG: a heading off the `## [X.Y.Z]` shape would otherwise
      # surface only at tag time, as an empty release body. `!cancelled()` so a
      # red harness above doesn't skip it; gated on the checkout so it can't
      # fail noisily.
      - name: Extract the current version's section from the real CHANGELOG
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' }}
        run: |
          set -euo pipefail
          # awk `exit` rather than `grep | head -1`: under pipefail an
          # early-closing `head` can fail the pipeline with 141.
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          # An empty version would search for `## []` and pass vacuously.
          if [ -z "$VERSION" ]; then
            echo "::error::No anchored 'version = ' line in Cargo.toml — the version could not be read, so this check verified nothing."
            exit 1
          fi
          echo "Cargo.toml version: $VERSION"
          rc=0
          .github/scripts/extract_changelog_section.sh CHANGELOG.md "$VERSION" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "CHANGELOG.md has a [$VERSION] section"
          elif [ "$rc" -eq 1 ]; then
            # Normal between a version bump and its CHANGELOG entry, so only a
            # warning.
            echo "::warning::CHANGELOG.md has no [$VERSION] section — a release tagged now would fall back to a raw commit list for its body."
          else
            # Exit 2: bad arguments or no CHANGELOG.md.
            echo "::error::extract_changelog_section.sh exited $rc — a usage or environment error, not a missing section."
            exit 1
          fi

      # #458: `[Unreleased]` is where parallel PRs collide, and a "keep both"
      # resolution misfiles entries silently. The section ships verbatim as the
      # release body, so check its structure here, not at tag time.
      - name: Lint the real CHANGELOG's structure
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::No anchored 'version = ' line in Cargo.toml — the version could not be read, so this check verified nothing."
            exit 1
          fi
          rc=0
          .github/scripts/check_changelog.sh CHANGELOG.md "$VERSION" || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::CHANGELOG.md has structural problems (listed above) — usually a merge that kept both sides of [Unreleased]. The version section ships verbatim as the release body."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::check_changelog.sh exited $rc — a usage or environment error, not a lint finding."
            exit 1
          fi
          echo "CHANGELOG.md structure OK ([Unreleased] and [$VERSION] checked)"

      # Guarded like the step above, so a red harness can't silently skip these.
      - name: 'Parse-check workflow run: blocks'
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' }}
        run: python3 .github/scripts/check_workflow_shell.py
      # actionlint (#453) reads what the parse check cannot: `${{ }}`
      # expressions, job and step wiring, and, through the runner's
      # shellcheck, every workflow's run: blocks. Every file in
      # .github/workflows/ is linted. A pinned release, checked against its
      # published checksums.
      - name: Lint the workflows (actionlint)
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' }}
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir=$(mktemp -d)
          curl -fsSL --retry 3 -o "$dir/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$dir" && grep -F "  $tarball" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$tarball" -C "$dir" actionlint
          "$dir/actionlint" -version
          "$dir/actionlint" -color
      # Not a harness under `.github/scripts/tests/`, so run explicitly.
      - name: Gap tracker matches the CI sweep baseline
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' }}
        run: .github/scripts/check_gap_tracker_baseline.sh
      # The coverage oracle's bindings.json is the dump script's output for
      # the baseline release. A PR that changes the script, the baseline or
      # the snapshot without regenerating would merge green and then fail
      # the daily api-surface-sweep. Needs PyPI, so only on PRs that touch
      # one of them.
      - name: API snapshot matches the dump of the baseline release
        if: ${{ !cancelled() && steps.checkout.conclusion == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- \
            .github/scripts/dump_bindings_schema.py \
            .github/scripts/refresh_api_snapshot.sh \
            .github/last-swept-sdk-version \
            tests/fixtures/api_surface/bindings.json)
          if [ -z "$changed" ]; then
            echo "No snapshot input changed; nothing to check."
            exit 0
          fi
          echo "Changed: $changed"
          .github/scripts/refresh_api_snapshot.sh --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Strict mode (`--cfg genai_strict_unknown`, D-030) compiles code in and
      # out (the coverage oracle's response side), so lint it too.
      - name: Run clippy (strict mode)
        env:
          RUSTFLAGS: --cfg genai_strict_unknown
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The library a consumer gets with `default-features = false`, which
      # compiles code the all-features run never sees (the plain wire printer
      # without `wire-color`). Same command as `make clippy`.
      - name: Run clippy (no default features)
        run: cargo clippy --lib --no-default-features -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      - name: Check documentation (all features)
        run: cargo doc --workspace --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation (docs.rs feature set)
        # Mirrors [package.metadata.docs.rs] on stable. Nightly-only breakage is
        # caught by release.yml's validate job.
        run: cargo doc --workspace --no-deps --features antigravity
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-mold
      # All features: the antigravity module and its dependencies must build
      # on the MSRV too, not just the default feature set.
      - name: Check workspace with MSRV
        run: cargo check --workspace --all-features

  cross-platform:
    name: Cross Platform (${{ matrix.os }}, ${{ matrix.rust }})
    # Offline on every leg: no key, no live tests. The full matrix runs on
    # main pushes, the weekly schedule and manual runs; a PR runs the Windows
    # stable leg only, the platform that broke unnoticed (#486, and eleven red
    # main pushes in #504), at one runner's cost. That leg keeps the full
    # matrix's check name, `Cross Platform (windows-latest, stable)`.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        rust: ${{ github.event_name == 'pull_request' && fromJSON('["stable"]') || fromJSON('["stable", "beta"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.rust }}
      # No `if: runner.os == 'Linux'`: the composite guards itself.
      - uses: ./.github/actions/setup-mold
      - name: Build
        id: build
        run: cargo build --workspace --release
      - name: Run tests
        # Use release mode on Windows to avoid linker resource exhaustion (error 1318).
        # bash on every OS, so `$NEXTEST_FILTER` expands the same on Windows.
        shell: bash
        env:
          # trybuild's ui_tests compare rustc's exact diagnostics, which beta
          # rewords, so their .stderr snapshots only hold on stable (#501;
          # tests/ci_coverage.rs, `ui_tests_do_not_run_on_beta`).
          NEXTEST_FILTER: ${{ matrix.rust == 'beta' && 'not binary(ui_tests)' || 'all()' }}
        run: cargo nextest run --workspace --cargo-profile release -E "$NEXTEST_FILTER"
      # Not skipped by a red unit test: one failing test once kept the
      # Windows doctests from running for eleven pushes (#504).
      - name: Run doctests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --workspace --release --doc
      # The antigravity module's `cfg(not(unix))` process handling (no
      # process groups: the harness alone is killed) and its macOS libproc
      # lookup compile nowhere else: test-antigravity runs on Linux only.
      - name: Check the antigravity feature
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: cargo check --features antigravity

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: ./.github/actions/setup-mold
      - uses: taiki-e/install-action@cargo-nextest
      - name: Generate coverage
        # nextest (process per test): several unit tests assume process
        # isolation and flake under plain `cargo test` threads (#418).
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
      # Every run, token or not: with no Codecov upload, the job summary is
      # where the coverage is read. `--workspace` as above: without it the
      # report covers the root package only, not genai-rs-macros.
      - name: Coverage summary
        run: |
          set -euo pipefail
          cargo llvm-cov report --workspace --summary-only | tee coverage-summary.txt
          {
            echo "## Code coverage"
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The upload needs the CODECOV_TOKEN secret. Without one it is skipped,
      # and the summary above stands in; with one, a failed upload fails the
      # job instead of passing with nothing uploaded.
      - name: Check for a Codecov token
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CODECOV_TOKEN secret, so nothing is uploaded to Codecov; the job summary has the coverage"
          fi
      - uses: codecov/codecov-action@v4
        if: steps.codecov.outputs.upload == 'true'
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-metrics:
    name: Build Metrics
    runs-on: ubuntu-latest
    # PRs consume the size baseline; main pushes publish it.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: read # `gh run download` for the baseline artifact
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-mold
      - name: Clean build time
        # Same feature set as the examples build, so the lib compiles once and
        # this number describes the build the sizes come from.
        run: |
          cargo clean
          start=$(date +%s)
          cargo build --release --features antigravity
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "## Build Metrics"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Clean release build | ${duration}s |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build examples
        # --features antigravity: those examples have required-features and
        # would be skipped silently. Changing the feature set shifts every
        # example against the baseline; waive that one PR with `size-growth-ok`.
        run: |
          start=$(date +%s)
          cargo build --release --examples --features antigravity
          end=$(date +%s)
          duration=$((end - start))
          echo "| Examples build | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"
      - name: Measure example sizes
        run: |
          .github/scripts/check_example_sizes.sh measure \
            target/release/examples current-sizes.json
          cat current-sizes.json

      # Rendered from current-sizes.json: one size definition for every report.
      - name: Binary sizes
        run: |
          .github/scripts/check_example_sizes.sh render current-sizes.json \
            >> "$GITHUB_STEP_SUMMARY"
      # Per-example delta against the last main build. The baseline is an
      # artifact, not a committed file, because sizes depend on the toolchain
      # and linker.
      - name: Fetch the size baseline from main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Best-effort: with no baseline, the compare step warns and skips.
          # `// empty`: jq prints "null" on an empty result. `completed`, not
          # `success`: that status is the whole run's, and one live-test flake
          # would discard a good baseline. gh's stderr is kept so a permissions
          # or rate-limit failure is distinguishable from "no artifact".
          # `rust.yml`, not the renamable display name.
          if ! RUN_IDS=$(gh run list --workflow rust.yml --branch main --status completed \
              --limit 10 --json databaseId --jq '.[].databaseId // empty'); then
            echo "::warning::Could not list main runs — the baseline lookup failed rather than finding nothing. See the gh error above; check the actions:read permission and rate limits."
            RUN_IDS=""
          fi
          for run_id in $RUN_IDS; do
            if gh run download "$run_id" --name size-baseline --dir baseline 2>/dev/null; then
              echo "Baseline from run $run_id"
              break
            fi
          done
          if [ -f baseline/current-sizes.json ]; then
            cp baseline/current-sizes.json baseline-sizes.json
          else
            echo "No size-baseline artifact on any of the last 10 completed main runs"
            : > baseline-sizes.json
          fi

      # PR-only: a direct push has no label to waive with and becomes the
      # baseline itself. Relies on branch protection requiring PRs into main.
      - name: Check size deltas
        if: github.event_name == 'pull_request'
        env:
          # Read here, not in the script, so the script needs no `gh`.
          SIZE_GROWTH_OK: ${{ contains(github.event.pull_request.labels.*.name, 'size-growth-ok') }}
        # Deltas go to the step summary too: nobody opens the log on a green
        # run.
        run: |
          # pipefail, or the step would take tee's status.
          set -o pipefail
          {
            echo '### Example size deltas vs main'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          .github/scripts/check_example_sizes.sh compare \
            baseline-sizes.json current-sizes.json 15 \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          # Fenced to keep the column alignment; closed unconditionally.
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Backstop for the no-baseline case; the delta check is the real gate.
      - name: Sanity ceiling
        # The 64 MiB default and its message live in the script (#456).
        run: .github/scripts/check_example_sizes.sh ceiling current-sizes.json

      # After the sanity ceiling, so a rejected build never becomes the
      # baseline.
      - name: Publish the size baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: size-baseline
          path: current-sizes.json
          retention-days: 90

  # A red push to main blocks nothing and tells no one: main's Windows legs
  # failed on eleven pushes in a row before anyone looked (#504). So a red push
  # opens or updates a `ci-health-escalation` issue of its own ("Push to main
  # failing: Rust"), and the next green push closes it (D-045). Not the
  # scheduled run's issue: a push skips the captured-fixtures refresh, so a
  # green one must not close a scheduled failure. A live job that fails after
  # its retries escalates too; the next green push closes the issue.
  main-push-status:
    name: Main Push Status
    # Every other job but scheduled-run-status, which needs this one (the two
    # never both run). tests/ci_workflows/ enforces it. Jobs that skip
    # pushes report `skipped` here, which neither escalates nor blocks the
    # resolve.
    needs: [check, test, test-strict-unknown, test-antigravity, test-integration, example-smoke, captured-fixtures, fmt, shell-scripts, clippy, doc, msrv, cross-platform, coverage, build-metrics]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'evansenter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Escalate a failing push to main
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # From context, not a literal: with the trigger, the join key
          # between reporter and resolver.
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
          ESCALATION_TRIGGER: push
        run: |
          .github/scripts/report_scheduled_failure.sh "$SELF_WORKFLOW_NAME" "$RUN_URL" \
            "Nothing waits on a push to \`main\`, and most of the Cross Platform
          matrix runs only there and on the weekly schedule (a PR runs Windows
          stable alone). A red Cross Platform leg is usually a platform
          difference: line endings broke Windows twice (#486, #504). A red live
          job failed after its retries, so it is a flake streak or an API
          change: probe with \`LOUD_WIRE=1\` before changing code. Each further
          failing push comments below."
      - name: Clear the failure issue once a push recovers
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
          ESCALATION_TRIGGER: push
        run: .github/scripts/resolve_scheduled_failure.sh "$SELF_WORKFLOW_NAME"

  # Scheduled runs fail quietly (an email to whoever last committed this file),
  # so a red weekly run opens or updates a `ci-health-escalation` issue and a
  # green one closes it. Its own job, so it sees every job's result.
  scheduled-run-status:
    name: Scheduled Run Status
    # Every other job, so a job added later can't go red unreported.
    # tests/ci_coverage.rs enforces it. Push- or PR-only jobs report
    # `skipped` here, which neither escalates nor blocks the resolve (as
    # main-push-status always does on a schedule).
    needs: [check, test, test-strict-unknown, test-antigravity, test-integration, example-smoke, captured-fixtures, fmt, shell-scripts, clippy, doc, msrv, cross-platform, coverage, build-metrics, main-push-status]
    if: always() && github.event_name == 'schedule' && github.repository_owner == 'evansenter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Escalate a failing scheduled run
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # From context, not a literal: it is the join key between reporter and
          # resolver.
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          .github/scripts/report_scheduled_failure.sh "$SELF_WORKFLOW_NAME" "$RUN_URL" \
            "The weekly run exercises the live API against \`main\` with nothing
          pushed, so a red integration job usually means the API changed: a new
          required field, a renamed key, a retired model. Probe with
          \`LOUD_WIRE=1\` before changing code, and see CLAUDE.md, Tests: live
          tests must fail, not skip. A red non-live job is toolchain drift, such
          as a new stable clippy lint."
      - name: Clear the failure issue once the run recovers
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: .github/scripts/resolve_scheduled_failure.sh "$SELF_WORKFLOW_NAME"
