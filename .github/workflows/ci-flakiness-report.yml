name: CI Flakiness Report

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9am UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  issues: write
  actions: read  # Required for artifact access

# Serialized: two overlapping runs with no rolling issue would both create one.
# No cancel-in-progress, so a running report is never cut short.
concurrency:
  group: ci-flakiness-report
  cancel-in-progress: false

jobs:
  flakiness-report:
    name: Generate Flakiness Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect and categorize failures
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DAYS_BACK=7
          WORKFLOW_NAME="Rust"

          END_DATE=$(date -u +"%Y-%m-%d")
          START_DATE=$(date -u -d "$DAYS_BACK days ago" +"%Y-%m-%d")

          echo "Analyzing CI runs from $START_DATE to $END_DATE"
          echo "start_date=$START_DATE" >> $GITHUB_OUTPUT
          echo "end_date=$END_DATE" >> $GITHUB_OUTPUT

          TOTAL_RUNS=0
          FAILED_RUNS=0
          # `=()`: under `set -u` a never-assigned array is unset, and `${#...}`
          # would abort on a week with no failures.
          declare -A TEST_FAILURES=()
          declare -A TEST_FILES=()
          declare -A TEST_CATEGORIES=()

          API_ERRORS=0
          RATE_LIMIT=0
          ASSERTION_FAILURES=0
          PANIC=0
          UNKNOWN=0

          echo "Fetching workflow runs..."
          RUNS_JSON=$(gh run list \
            --workflow "$WORKFLOW_NAME" \
            --limit 200 \
            --json databaseId,conclusion,createdAt,headBranch,event \
            2>/dev/null || echo "[]")

          WEEK_AGO=$(date -u -d "$DAYS_BACK days ago" +%s)

          while IFS= read -r run; do
            RUN_ID=$(echo "$run" | jq -r '.databaseId')
            CONCLUSION=$(echo "$run" | jq -r '.conclusion')
            CREATED_AT=$(echo "$run" | jq -r '.createdAt')

            RUN_TS=$(date -d "$CREATED_AT" +%s 2>/dev/null || echo "0")
            if [ "$RUN_TS" -lt "$WEEK_AGO" ]; then
              continue
            fi

            TOTAL_RUNS=$((TOTAL_RUNS + 1))

            if [ "$CONCLUSION" = "failure" ]; then
              FAILED_RUNS=$((FAILED_RUNS + 1))

              echo "Analyzing failed run $RUN_ID..."

              CATEGORIZED=$(.github/scripts/categorize_failures.sh "$RUN_ID" 2>/dev/null || echo '{"totals":{}}')

              API_ERRORS=$((API_ERRORS + $(echo "$CATEGORIZED" | jq -r '.totals.api_errors // 0')))
              RATE_LIMIT=$((RATE_LIMIT + $(echo "$CATEGORIZED" | jq -r '.totals.rate_limit // 0')))
              ASSERTION_FAILURES=$((ASSERTION_FAILURES + $(echo "$CATEGORIZED" | jq -r '.totals.assertion_failures // 0')))
              PANIC=$((PANIC + $(echo "$CATEGORIZED" | jq -r '.totals.panic // 0')))
              UNKNOWN=$((UNKNOWN + $(echo "$CATEGORIZED" | jq -r '.totals.unknown // 0')))

              for category in api_errors rate_limit assertion_failures panic unknown; do
                while IFS= read -r test_name; do
                  if [ -n "$test_name" ] && [ "$test_name" != "null" ]; then
                    if [ -n "${TEST_FAILURES[$test_name]:-}" ]; then
                      TEST_FAILURES[$test_name]=$((TEST_FAILURES[$test_name] + 1))
                    else
                      TEST_FAILURES[$test_name]=1
                      TEST_CATEGORIES[$test_name]="$category"
                    fi
                  fi
                done < <(echo "$CATEGORIZED" | jq -r ".categories.$category[]?" 2>/dev/null || true)
              done
            fi
          done < <(echo "$RUNS_JSON" | jq -c '.[]')

          UNIQUE_FLAKY=${#TEST_FAILURES[@]}

          echo "total_runs=$TOTAL_RUNS" >> $GITHUB_OUTPUT
          echo "failed_runs=$FAILED_RUNS" >> $GITHUB_OUTPUT
          echo "unique_flaky=$UNIQUE_FLAKY" >> $GITHUB_OUTPUT
          echo "api_errors=$API_ERRORS" >> $GITHUB_OUTPUT
          echo "rate_limit=$RATE_LIMIT" >> $GITHUB_OUTPUT
          echo "assertion_failures=$ASSERTION_FAILURES" >> $GITHUB_OUTPUT
          echo "panic=$PANIC" >> $GITHUB_OUTPUT

          echo "Locating test files..."
          for test_name in "${!TEST_FAILURES[@]}"; do
            FILE=$(grep -rlE "fn $test_name|fn ${test_name#*::}" tests/ src/ 2>/dev/null | head -1 || echo "unknown")
            if [ -n "$FILE" ] && [ "$FILE" != "unknown" ]; then
              TEST_FILES[$test_name]=$(basename "$FILE")
            else
              TEST_FILES[$test_name]="unknown"
            fi
          done

          jq -n \
            --argjson total_runs "$TOTAL_RUNS" \
            --argjson failed_runs "$FAILED_RUNS" \
            --argjson unique_flaky "$UNIQUE_FLAKY" \
            --argjson api_errors "$API_ERRORS" \
            --argjson rate_limit "$RATE_LIMIT" \
            --argjson assertion_failures "$ASSERTION_FAILURES" \
            --argjson panic "$PANIC" \
            --argjson unknown "$UNKNOWN" \
            --arg date "$END_DATE" \
            '{
              total_runs: $total_runs,
              failed_runs: $failed_runs,
              unique_flaky: $unique_flaky,
              api_errors: $api_errors,
              rate_limit: $rate_limit,
              assertion_failures: $assertion_failures,
              panic: $panic,
              unknown: $unknown,
              date: $date
            }' > summary.json

          echo "[]" > tests.json
          for test_name in "${!TEST_FAILURES[@]}"; do
            ITEM_JSON=$(jq -n \
              --arg name "$test_name" \
              --argjson failures "${TEST_FAILURES[$test_name]}" \
              --arg category "${TEST_CATEGORIES[$test_name]:-unknown}" \
              --arg file "${TEST_FILES[$test_name]:-unknown}" \
              '{name: $name, failures: $failures, category: $category, file: $file}') || continue
            jq --argjson new "$ITEM_JSON" '. + [$new]' tests.json > tests.json.tmp \
              && mv tests.json.tmp tests.json
          done

      - name: Compare trends
        id: trends
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/compare_trends.sh "flakiness-summary" summary.json > trends.json

      - name: Generate report
        id: report
        run: |
          # pipefail: a swallowed jq failure below would write an empty
          # baseline, which the next run reads as "report everything".
          set -euo pipefail
          .github/scripts/generate_flakiness_report.sh \
            --trends trends.json \
            --tests tests.json \
            --start-date "${{ steps.collect.outputs.start_date }}" \
            --end-date "${{ steps.collect.outputs.end_date }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            > flakiness_report.md

          # The table is capped at 10, so the full set goes in a hidden marker
          # for the next run's diff. Emitted even when empty.
          {
            echo
            echo "<!-- flaky-baseline"
            jq -r '.[].name' tests.json | sort -u
            echo "-->"
          } >> flakiness_report.md

          echo "=== Report Content ==="
          cat flakiness_report.md
          echo "======================"

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flakiness-summary-${{ steps.collect.outputs.end_date }}
          path: summary.json
          retention-days: 14

      - name: Create or update the rolling report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # One rolling issue with a fixed title, updated in place, not one per
          # run (#425).
          TITLE="CI Flakiness Report (rolling 7-day window)"
          # Legacy date-stamped title, so the first run adopts the newest old
          # report. Single-use: delete once that run has gone green.
          LEGACY_PREFIX="CI Flakiness Report - Week of"

          # Exact matches first, so the rolling issue beats a legacy one. No
          # error suppression: a failed lookup must not read as "none" and fork
          # the issue. --limit 100: `ci-health` is shared with hand-filed
          # issues.
          EXISTING_ISSUE=$(gh issue list \
            --label "ci-health" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq "([.[] | select(.title == \"$TITLE\") | .number] + [.[] | select(.title | startswith(\"$LEGACY_PREFIX\")) | .number]) | first // empty")

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing issue #$EXISTING_ISSUE"

            # `gh issue edit` notifies nobody, so newly flaky tests (vs the
            # baseline marker, within the 7-day window) get a comment.
            # `tr -d "\r"`: web-UI edits come back CRLF, which breaks the
            # anchored marker match.
            PREVIOUS_NAMES=$(gh issue view "$EXISTING_ISSUE" --json body --jq .body \
              | tr -d '\r' \
              | sed -n '/^<!-- flaky-baseline$/,/^-->$/p' \
              | sed '1d;$d' | sort -u)
            CURRENT_NAMES=$(jq -r '.[].name' tests.json | sort -u)
            NEW_NAMES=$(comm -13 <(echo "$PREVIOUS_NAMES") <(echo "$CURRENT_NAMES") | sed '/^$/d')

            # Comment before edit: the edit commits the new baseline, so this
            # order keeps a failed comment retryable.
            if [ -n "$NEW_NAMES" ]; then
              gh issue comment "$EXISTING_ISSUE" --body "$(
                echo "**Newly flaky since the last report:**"
                echo
                sed 's/^/- `/; s/$/`/' <<<"$NEW_NAMES"
                echo
                echo "New to the rolling 7-day window — a test that had gone"
                echo "quiet for longer than the window counts as new again."
                echo "The body above has the full current window."
                echo
                echo "---"
                echo "_Generated by [Claude Code](https://claude.ai/code)_"
              )"
              echo "Commented: $(wc -l <<<"$NEW_NAMES") newly flaky test(s)"
            fi

            # Retitles an adopted legacy issue and commits the new baseline.
            gh issue edit "$EXISTING_ISSUE" \
              --title "$TITLE" \
              --body-file "flakiness_report.md"

            echo "Updated issue: ${{ github.server_url }}/${{ github.repository }}/issues/$EXISTING_ISSUE"
          else
            echo "Creating new issue"
            gh label create "ci-health" \
              --description "CI health and flakiness tracking" \
              --color "fbca04" \
              2>/dev/null || true

            NEW_ISSUE=$(gh issue create \
              --title "$TITLE" \
              --body-file "flakiness_report.md" \
              --label "ci-health")
            echo "Created issue: $NEW_ISSUE"
          fi

      # Scheduled failures otherwise only email the last committer of this file
      # (#431). Does not fire for a cancelled or timed-out job.
      - name: Escalate a failing scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # From context, not a literal: it is the join key with the resolver.
          # `SELF_` to keep it apart from the collect step's WORKFLOW_NAME.
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: .github/scripts/report_scheduled_failure.sh "$SELF_WORKFLOW_NAME" "$RUN_URL"

      # Also on dispatch, unlike audit.yml: this job doesn't branch on the
      # event, so a manual run exercises the scheduled path.
      - name: Clear the failure issue once the run recovers
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: .github/scripts/resolve_scheduled_failure.sh "$SELF_WORKFLOW_NAME"
