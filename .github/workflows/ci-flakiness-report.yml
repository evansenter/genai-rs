name: CI Flakiness Report

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9am UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  issues: write
  actions: read  # Required for artifact access

# Serialized: two overlapping runs with no rolling issue would both create one.
# No cancel-in-progress, so a running report is never cut short.
concurrency:
  group: ci-flakiness-report
  cancel-in-progress: false

jobs:
  flakiness-report:
    name: Generate Flakiness Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect and categorize failures
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DAYS_BACK=7
          WORKFLOW_NAME="Rust"
          # The jobs whose green runs can hide a flake: the live integration
          # groups and the antigravity job's harness step, which run nextest
          # with retries (NEXTEST_RETRIES in the step's env), and the two
          # example smoke loops, which retry by hand and print
          # EXAMPLE_RETRIED. count_retried_flakes.sh counts only the steps
          # that retry, so the antigravity job's offline suite, in the same
          # log, stays out of the rate. tests/ci_workflows/ ties this to
          # rust.yml's job names.
          RETRY_JOBS='^(Integration Tests \(.*\)|Test Suite \(antigravity\)|Example Smoke Run)$'

          # jq, not `date -d`, so the harness runs this on BSD date too.
          END_DATE=$(jq -nr 'now | strftime("%Y-%m-%d")')
          START_DATE=$(jq -nr --argjson d "$DAYS_BACK" 'now - $d * 86400 | strftime("%Y-%m-%d")')
          WEEK_AGO=$(jq -n --argjson d "$DAYS_BACK" 'now - $d * 86400 | floor')

          echo "Analyzing CI runs from $START_DATE to $END_DATE"
          {
            echo "start_date=$START_DATE"
            echo "end_date=$END_DATE"
          } >> "$GITHUB_OUTPUT"

          TOTAL_RUNS=0
          FAILED_RUNS=0
          # Runs of main (push, schedule, dispatch on main) apart from the
          # rest, pull requests and branches: a red PR run is usually the
          # change under review, not a flake, so only main's failed runs
          # are categorized.
          MAIN_RUNS=0
          FAILED_MAIN=0
          BRANCH_RUNS=0
          FAILED_BRANCH=0
          # `=()`: under `set -u` a never-assigned array is unset, and `${#...}`
          # would abort on a week with no failures.
          declare -A TEST_FAILURES=()
          declare -A TEST_FILES=()
          declare -A TEST_CATEGORIES=()

          API_ERRORS=0
          RATE_LIMIT=0
          ASSERTION_FAILURES=0
          PANIC=0
          DETERMINISTIC=0
          UNKNOWN=0

          LOG_DIR=$(mktemp -d)
          LOGS_READ=0
          LOGS_MISSED=0

          # The window's runs only, by creation date, up to what the API
          # serves for a filtered listing (1,000; about 115 a week now). A
          # listing that fills the limit may have left runs out, so the step
          # fails rather than report on part of the week, and a failed
          # listing fails it too: an empty week would read as "no live test
          # runs".
          RUN_LIMIT=1000
          echo "Fetching workflow runs..."
          RUNS_JSON=$(gh run list \
            --workflow "$WORKFLOW_NAME" \
            --created ">=$START_DATE" \
            --limit "$RUN_LIMIT" \
            --json databaseId,conclusion,createdAt,headBranch,event)
          LISTED=$(jq 'length' <<<"$RUNS_JSON")
          echo "Listed $LISTED runs created since $START_DATE"
          if [ "$LISTED" -ge "$RUN_LIMIT" ]; then
            echo "::error::gh run list returned $LISTED runs, its limit, so the window may hold more and the report would leave them out. Raise RUN_LIMIT past the week's runs or shorten DAYS_BACK."
            exit 1
          fi

          while IFS= read -r run; do
            RUN_ID=$(echo "$run" | jq -r '.databaseId')
            CONCLUSION=$(echo "$run" | jq -r '.conclusion')
            RUN_TS=$(echo "$run" | jq -r '(.createdAt | fromdateiso8601?) // 0')
            if [ "$RUN_TS" -lt "$WEEK_AGO" ]; then
              continue
            fi
            ON_MAIN=$(echo "$run" | jq -r '.event != "pull_request" and .headBranch == "main"')

            TOTAL_RUNS=$((TOTAL_RUNS + 1))
            if [ "$ON_MAIN" = "true" ]; then
              MAIN_RUNS=$((MAIN_RUNS + 1))
            else
              BRANCH_RUNS=$((BRANCH_RUNS + 1))
            fi

            if [ "$CONCLUSION" = "failure" ]; then
              FAILED_RUNS=$((FAILED_RUNS + 1))
            fi
            if [ "$CONCLUSION" = "failure" ] && [ "$ON_MAIN" != "true" ]; then
              FAILED_BRANCH=$((FAILED_BRANCH + 1))
            elif [ "$CONCLUSION" = "failure" ]; then
              FAILED_MAIN=$((FAILED_MAIN + 1))

              echo "Analyzing failed run $RUN_ID..."

              CATEGORIZED=$(.github/scripts/categorize_failures.sh "$RUN_ID" 2>/dev/null || echo '{"totals":{}}')

              API_ERRORS=$((API_ERRORS + $(echo "$CATEGORIZED" | jq -r '.totals.api_errors // 0')))
              RATE_LIMIT=$((RATE_LIMIT + $(echo "$CATEGORIZED" | jq -r '.totals.rate_limit // 0')))
              ASSERTION_FAILURES=$((ASSERTION_FAILURES + $(echo "$CATEGORIZED" | jq -r '.totals.assertion_failures // 0')))
              PANIC=$((PANIC + $(echo "$CATEGORIZED" | jq -r '.totals.panic // 0')))
              DETERMINISTIC=$((DETERMINISTIC + $(echo "$CATEGORIZED" | jq -r '.totals.deterministic // 0')))
              UNKNOWN=$((UNKNOWN + $(echo "$CATEGORIZED" | jq -r '.totals.unknown // 0')))

              for category in api_errors rate_limit assertion_failures panic deterministic unknown; do
                while IFS= read -r test_name; do
                  if [ -n "$test_name" ] && [ "$test_name" != "null" ]; then
                    label="$category"
                    if [ "$category" = "deterministic" ]; then
                      label="deterministic on $(echo "$CATEGORIZED" | jq -r --arg t "$test_name" '.os[$t] // "one OS"')"
                    fi
                    TEST_FAILURES[$test_name]=$((${TEST_FAILURES[$test_name]:-0} + 1))
                    # A deterministic break is the label that sticks.
                    if [ -z "${TEST_CATEGORIES[$test_name]:-}" ] || [ "$category" = "deterministic" ]; then
                      TEST_CATEGORIES[$test_name]="$label"
                    fi
                  fi
                done < <(echo "$CATEGORIZED" | jq -r ".categories.${category}[]?" 2>/dev/null || true)
              done
            fi

            # A test nextest retried to a pass leaves its job green, so the
            # retry jobs' logs are read on every finished run, not only the
            # failed ones (#492). A log that cannot be fetched is counted and
            # reported, not silently dropped.
            if [ "$CONCLUSION" = "success" ] || [ "$CONCLUSION" = "failure" ]; then
              JOB_IDS=$(gh run view "$RUN_ID" --json jobs 2>/dev/null \
                | jq -r --arg re "$RETRY_JOBS" '.jobs[]
                    | select((.name | test($re)) and (.conclusion == "success" or .conclusion == "failure"))
                    | .databaseId' || true)
              for JOB_ID in $JOB_IDS; do
                if gh run view --job "$JOB_ID" --log > "${LOG_DIR:?}/$RUN_ID-$JOB_ID.log" 2>/dev/null; then
                  LOGS_READ=$((LOGS_READ + 1))
                else
                  LOGS_MISSED=$((LOGS_MISSED + 1))
                  rm -f "${LOG_DIR:?}/${RUN_ID:?}-${JOB_ID:?}.log"
                fi
              done
            fi
          done < <(echo "$RUNS_JSON" | jq -c '.[]')

          echo "Read $LOGS_READ retry-job logs ($LOGS_MISSED could not be fetched)"
          if [ "$LOGS_MISSED" -gt 0 ]; then
            echo "::warning::$LOGS_MISSED job log(s) could not be fetched, so their retried flakes are not counted"
          fi
          if [ "$LOGS_READ" -gt 0 ]; then
            .github/scripts/count_retried_flakes.sh "${LOG_DIR:?}"/*.log > retried.json
          else
            echo '{"tests_run": 0, "flaky": 0, "tests": [], "examples_run": 0, "examples_retried": 0, "examples": [], "skip_markers": 0, "skips": []}' > retried.json
          fi
          rm -rf "${LOG_DIR:?}"
          RETRIED_FLAKES=$(jq -r '.flaky' retried.json)
          LIVE_TEST_RUNS=$(jq -r '.tests_run' retried.json)
          EXAMPLES_RUN=$(jq -r '.examples_run // 0' retried.json)
          EXAMPLES_RETRIED=$(jq -r '.examples_retried // 0' retried.json)
          # Skip markers across the week: each job budgets its own run's,
          # and nothing else adds them up, so a test that skips its check in
          # run after run would never show.
          SKIP_MARKERS=$(jq -r '.skip_markers // 0' retried.json)
          SKIPPED_TESTS=$(jq -c '[(.skips // [])[] | {name, markers, runs,
            file: (if .binary == "lib" then "src/" elif .binary == "" then "unknown" else "tests/\(.binary).rs" end)}]' retried.json)

          # Flakes are named by test; nextest names the binary too, which
          # locates the file without a grep. An example is named for its
          # `cargo run --example`. A flake's runs are the runs it ran in,
          # for its own share (the report flags one over 5%).
          declare -A TEST_RETRIED=()
          declare -A TEST_RUNS=()
          while IFS=$'\t' read -r test_name file count runs; do
            [ -n "$test_name" ] || continue
            TEST_RETRIED[$test_name]=$((${TEST_RETRIED[$test_name]:-0} + count))
            TEST_RUNS[$test_name]=$((${TEST_RUNS[$test_name]:-0} + runs))
            TEST_FILES[$test_name]="$file"
            if [ -z "${TEST_FAILURES[$test_name]:-}" ]; then
              TEST_FAILURES[$test_name]=0
              TEST_CATEGORIES[$test_name]="passed on retry"
            fi
          done < <(jq -r '
            (.tests[] | [.name, (if .binary == "lib" then "src/" else "tests/\(.binary).rs" end),
                         (.flaky | tostring), (.runs // 0 | tostring)]),
            ((.examples // [])[] | ["example \(.name)", "cargo run --example \(.name)",
                                    (.flaky | tostring), (.runs // 0 | tostring)])
            | @tsv' retried.json)

          UNIQUE_FLAKY=${#TEST_FAILURES[@]}

          {
            echo "total_runs=$TOTAL_RUNS"
            echo "failed_runs=$FAILED_RUNS"
            echo "unique_flaky=$UNIQUE_FLAKY"
            echo "retried_flakes=$RETRIED_FLAKES"
            echo "live_test_runs=$LIVE_TEST_RUNS"
            echo "api_errors=$API_ERRORS"
            echo "rate_limit=$RATE_LIMIT"
            echo "assertion_failures=$ASSERTION_FAILURES"
            echo "panic=$PANIC"
          } >> "$GITHUB_OUTPUT"

          echo "Locating test files..."
          for test_name in "${!TEST_FAILURES[@]}"; do
            [ -n "${TEST_FILES[$test_name]:-}" ] && continue
            FILE=$(grep -rlE "fn $test_name|fn ${test_name##*::}" tests/ src/ 2>/dev/null | head -1 || echo "unknown")
            if [ -n "$FILE" ] && [ "$FILE" != "unknown" ]; then
              TEST_FILES[$test_name]=$(basename "$FILE")
            else
              TEST_FILES[$test_name]="unknown"
            fi
          done

          jq -n \
            --argjson total_runs "$TOTAL_RUNS" \
            --argjson failed_runs "$FAILED_RUNS" \
            --argjson main_runs "$MAIN_RUNS" \
            --argjson failed_runs_main "$FAILED_MAIN" \
            --argjson branch_runs "$BRANCH_RUNS" \
            --argjson failed_runs_branch "$FAILED_BRANCH" \
            --argjson unique_flaky "$UNIQUE_FLAKY" \
            --argjson retried_flakes "$RETRIED_FLAKES" \
            --argjson live_test_runs "$LIVE_TEST_RUNS" \
            --argjson examples_run "$EXAMPLES_RUN" \
            --argjson examples_retried "$EXAMPLES_RETRIED" \
            --argjson skip_markers "$SKIP_MARKERS" \
            --argjson skipped_tests "$SKIPPED_TESTS" \
            --argjson api_errors "$API_ERRORS" \
            --argjson rate_limit "$RATE_LIMIT" \
            --argjson assertion_failures "$ASSERTION_FAILURES" \
            --argjson panic "$PANIC" \
            --argjson deterministic "$DETERMINISTIC" \
            --argjson unknown "$UNKNOWN" \
            --arg date "$END_DATE" \
            '{
              total_runs: $total_runs,
              failed_runs: $failed_runs,
              main_runs: $main_runs,
              failed_runs_main: $failed_runs_main,
              branch_runs: $branch_runs,
              failed_runs_branch: $failed_runs_branch,
              unique_flaky: $unique_flaky,
              retried_flakes: $retried_flakes,
              live_test_runs: $live_test_runs,
              examples_run: $examples_run,
              examples_retried: $examples_retried,
              skip_markers: $skip_markers,
              skipped_tests: $skipped_tests,
              api_errors: $api_errors,
              rate_limit: $rate_limit,
              assertion_failures: $assertion_failures,
              panic: $panic,
              deterministic: $deterministic,
              unknown: $unknown,
              date: $date
            }' > summary.json

          echo "[]" > tests.json
          for test_name in "${!TEST_FAILURES[@]}"; do
            ITEM_JSON=$(jq -n \
              --arg name "$test_name" \
              --argjson failures "${TEST_FAILURES[$test_name]}" \
              --argjson retried "${TEST_RETRIED[$test_name]:-0}" \
              --argjson runs "${TEST_RUNS[$test_name]:-0}" \
              --arg category "${TEST_CATEGORIES[$test_name]:-unknown}" \
              --arg file "${TEST_FILES[$test_name]:-unknown}" \
              '{name: $name, failures: $failures, retried: $retried, runs: $runs, category: $category, file: $file}') || continue
            jq --argjson new "$ITEM_JSON" '. + [$new]' tests.json > tests.json.tmp \
              && mv tests.json.tmp tests.json
          done

      - name: Compare trends
        id: trends
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/compare_trends.sh "flakiness-summary" summary.json > trends.json

      - name: Generate report
        id: report
        run: |
          # pipefail: a swallowed jq failure below would write an empty
          # baseline, which the next run reads as "report everything".
          set -euo pipefail
          # Exit 3 is a complete report that breaches a target (a weekly
          # flake rate of 1% or more, no live test runs read, or a chronic
          # flake). The run goes on to publish it, and fails after the
          # issue is updated; any other non-zero exit is an error here.
          rc=0
          .github/scripts/generate_flakiness_report.sh \
            --trends trends.json \
            --summary summary.json \
            --tests tests.json \
            --start-date "${{ steps.collect.outputs.start_date }}" \
            --end-date "${{ steps.collect.outputs.end_date }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            > flakiness_report.md || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::generate_flakiness_report.sh exited $rc"
            exit "$rc"
          fi
          if [ "$rc" -eq 3 ]; then
            echo "breach=true" >> "$GITHUB_OUTPUT"
          else
            echo "breach=false" >> "$GITHUB_OUTPUT"
          fi

          # The table is capped at 10, so the full set goes in a hidden marker
          # for the next run's diff. Emitted even when empty.
          {
            echo
            echo "<!-- flaky-baseline"
            jq -r '.[].name' tests.json | sort -u
            echo "-->"
          } >> flakiness_report.md

          echo "=== Report Content ==="
          cat flakiness_report.md
          echo "======================"

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flakiness-summary-${{ steps.collect.outputs.end_date }}
          path: summary.json
          retention-days: 14

      - name: Create or update the rolling report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # One rolling issue with a fixed title, updated in place, not one per
          # run (#425).
          TITLE="CI Flakiness Report (rolling 7-day window)"
          # Legacy date-stamped title, so the first run adopts the newest old
          # report. Single-use: delete once that run has gone green.
          LEGACY_PREFIX="CI Flakiness Report - Week of"

          # Exact matches first, so the rolling issue beats a legacy one. No
          # error suppression: a failed lookup must not read as "none" and fork
          # the issue. --limit 100: `ci-health` is shared with hand-filed
          # issues.
          EXISTING_ISSUE=$(gh issue list \
            --label "ci-health" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq "([.[] | select(.title == \"$TITLE\") | .number] + [.[] | select(.title | startswith(\"$LEGACY_PREFIX\")) | .number]) | first // empty")

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing issue #$EXISTING_ISSUE"

            # `gh issue edit` notifies nobody, so newly flaky tests (vs the
            # baseline marker, within the 7-day window) get a comment.
            # `tr -d "\r"`: web-UI edits come back CRLF, which breaks the
            # anchored marker match.
            PREVIOUS_NAMES=$(gh issue view "$EXISTING_ISSUE" --json body --jq .body \
              | tr -d '\r' \
              | sed -n '/^<!-- flaky-baseline$/,/^-->$/p' \
              | sed '1d;$d' | sort -u)
            CURRENT_NAMES=$(jq -r '.[].name' tests.json | sort -u)
            NEW_NAMES=$(comm -13 <(echo "$PREVIOUS_NAMES") <(echo "$CURRENT_NAMES") | sed '/^$/d')

            # Comment before edit: the edit commits the new baseline, so this
            # order keeps a failed comment retryable.
            if [ -n "$NEW_NAMES" ]; then
              gh issue comment "$EXISTING_ISSUE" --body "$(
                echo "**Newly flaky since the last report:**"
                echo
                # Backticks in sed's own script, not a shell expansion.
                # shellcheck disable=SC2016
                sed 's/^/- `/; s/$/`/' <<<"$NEW_NAMES"
                echo
                echo "New to the rolling 7-day window — a test that had gone"
                echo "quiet for longer than the window counts as new again."
                echo "The body above has the full current window."
                echo
                echo "---"
                echo "_Generated by [Claude Code](https://claude.ai/code)_"
              )"
              echo "Commented: $(wc -l <<<"$NEW_NAMES") newly flaky test(s)"
            fi

            # Retitles an adopted legacy issue and commits the new baseline.
            gh issue edit "$EXISTING_ISSUE" \
              --title "$TITLE" \
              --body-file "flakiness_report.md"

            echo "Updated issue: ${{ github.server_url }}/${{ github.repository }}/issues/$EXISTING_ISSUE"
          else
            echo "Creating new issue"
            gh label create "ci-health" \
              --description "CI health and flakiness tracking" \
              --color "fbca04" \
              2>/dev/null || true

            NEW_ISSUE=$(gh issue create \
              --title "$TITLE" \
              --body-file "flakiness_report.md" \
              --label "ci-health")
            echo "Created issue: $NEW_ISSUE"
          fi

      # After the issue update, so a breached target is published before
      # the run fails on it, and before the escalation, which it triggers.
      - name: Fail on a breached flake target
        if: steps.report.outputs.breach == 'true'
        run: |
          echo "::error::The flakiness report breaches a target: a weekly flake rate of 1% or more, no live test runs read, or a test that passed only on a retry in more than 5% of its runs. The rolling ci-health issue has the report."
          exit 1

      # Scheduled failures otherwise only email the last committer of this file
      # (#431). Does not fire for a cancelled or timed-out job.
      - name: Escalate a failing scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # From context, not a literal: it is the join key with the resolver.
          # `SELF_` to keep it apart from the collect step's WORKFLOW_NAME.
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          .github/scripts/report_scheduled_failure.sh "$SELF_WORKFLOW_NAME" "$RUN_URL" \
            "The report fails on purpose when the week breaches a flake target:
          a flake rate of 1% or more, no live test runs read, or a chronic
          flake (a test that passed only on a retry in more than 5% of its
          runs). The rolling \`ci-health\` report issue names which, and the
          issue closes on the first run that meets every target. A failure
          before the report step is the workflow itself breaking."

      # Also on dispatch, unlike audit.yml: this job doesn't branch on the
      # event, so a manual run exercises the scheduled path.
      - name: Clear the failure issue once the run recovers
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: .github/scripts/resolve_scheduled_failure.sh "$SELF_WORKFLOW_NAME"
