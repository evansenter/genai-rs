name: Security Audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays

permissions:
  contents: read
  checks: write  # Required for rustsec/audit-check to post results
  # Also needed by `audit-check` itself: on `schedule` it files one issue per
  # advisory, and without this a real advisory surfaces as an opaque 403.
  issues: write

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security Audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Scheduled failures otherwise only email the last committer (#431).
      # Custom body: on `schedule`, audit-check files advisories as issues and
      # stays green, so a red run means the audit itself broke.
      - name: Escalate a failing scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # From context, not a literal: it is the join key between reporter and
          # resolver.
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          .github/scripts/report_scheduled_failure.sh "$SELF_WORKFLOW_NAME" "$RUN_URL" \
            "**This is probably not an advisory.** On a scheduled run \`audit-check\`
          reports findings by opening one issue per advisory and leaves the run
          green, so a red run means the audit itself could not complete — a
          network failure, a \`cargo audit\` or action regression, or a malformed
          \`Cargo.lock\`. Check the run log. If you are here about a vulnerability,
          look for the per-advisory issues instead; this issue tracks the
          monitoring, not the finding."

      # `schedule` only: audit-check takes a different branch on other events,
      # and a run may close the issue only if it exercises the path that opened
      # it.
      - name: Clear the failure issue once the run recovers
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: .github/scripts/resolve_scheduled_failure.sh "$SELF_WORKFLOW_NAME"
